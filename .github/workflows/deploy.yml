name: CI/CD Pipeline

on:
  push:
    branches: [ main, renanvn ]
  pull_request:
    branches: [ main, renanvn ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

  deploy-dev:
    name: Deploy to Dev (project-pt-internal)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/renanvn'
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check GCP Credentials Availability
        id: check_creds
        run: |
          if [ -n "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ]; then
            echo "has_wif=true" >> $GITHUB_OUTPUT
          else
            echo "has_wif=false" >> $GITHUB_OUTPUT
          fi
          
          if [ -n "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "has_key=true" >> $GITHUB_OUTPUT
          else
            echo "has_key=false" >> $GITHUB_OUTPUT
          fi

          if [ -n "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ] || [ -n "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
            echo "🔑 GCP Credentials found. Proceeding with authentication and deployment."
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "⚠️ No GCP credentials found. Skipping authentication and deployment."
          fi

      - name: Google Auth via WIF
        if: steps.check_creds.outputs.has_wif == 'true'
        id: auth_wif
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Google Auth via SA Key
        if: steps.check_creds.outputs.has_wif == 'false' && steps.check_creds.outputs.has_key == 'true'
        id: auth_key
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Core App to Dev Cloud Run
        if: steps.check_creds.outputs.has_creds == 'true'
        run: |
          gcloud run deploy "tap-race-dev" \
            --project "project-pt-internal" \
            --region "us-central1" \
            --source . \
            --allow-unauthenticated \
            --min-instances 1 \
            --max-instances 1 \
            --concurrency 1000 \
            --cpu 1 \
            --memory 512Mi \
            --no-cpu-throttling \
            --timeout 3600 \
            --port 8080 \
            --set-env-vars "ADMIN_TOKEN=${{ secrets.ADMIN_TOKEN || 'devsecret' }},PERSIST=on" \
            --quiet

      - name: Deploy Accessibility Microservice to Dev Cloud Run
        if: steps.check_creds.outputs.has_creds == 'true'
        run: |
          gcloud run deploy "tap-race-accessibility" \
            --project "project-pt-internal" \
            --region "us-central1" \
            --source . \
            --command "node" \
            --args "src/accessibility/server.js" \
            --allow-unauthenticated \
            --min-instances 1 \
            --max-instances 5 \
            --concurrency 500 \
            --cpu 1 \
            --memory 512Mi \
            --timeout 600 \
            --port 8081 \
            --set-env-vars "NODE_ENV=production,USE_MOCKS=true" \
            --quiet

  deploy-prod:
    name: Deploy to Production
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check GCP Credentials Availability
        id: check_creds
        run: |
          if [ -n "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ]; then
            echo "has_wif=true" >> $GITHUB_OUTPUT
          else
            echo "has_wif=false" >> $GITHUB_OUTPUT
          fi
          
          if [ -n "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "has_key=true" >> $GITHUB_OUTPUT
          else
            echo "has_key=false" >> $GITHUB_OUTPUT
          fi

          if [ -n "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ] || [ -n "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
            echo "🔑 GCP Credentials found. Proceeding with authentication and deployment."
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "⚠️ No GCP credentials found. Skipping authentication and deployment."
          fi

      - name: Google Auth via WIF
        if: steps.check_creds.outputs.has_wif == 'true'
        id: auth_wif
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Google Auth via SA Key
        if: steps.check_creds.outputs.has_wif == 'false' && steps.check_creds.outputs.has_key == 'true'
        id: auth_key
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Core App to Prod Cloud Run
        if: steps.check_creds.outputs.has_creds == 'true'
        run: |
          gcloud run deploy "${{ secrets.GCP_SERVICE_NAME || 'tap-race' }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ secrets.GCP_REGION || 'us-central1' }}" \
            --source . \
            --allow-unauthenticated \
            --min-instances 1 \
            --max-instances 1 \
            --concurrency 1000 \
            --cpu 1 \
            --memory 512Mi \
            --no-cpu-throttling \
            --timeout 3600 \
            --port 8080 \
            --set-env-vars "ADMIN_TOKEN=${{ secrets.ADMIN_TOKEN }},PERSIST=on" \
            --quiet

      - name: Deploy Accessibility Microservice to Prod Cloud Run
        if: steps.check_creds.outputs.has_creds == 'true'
        run: |
          gcloud run deploy "${{ secrets.GCP_SERVICE_NAME || 'tap-race' }}-accessibility" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ secrets.GCP_REGION || 'us-central1' }}" \
            --source . \
            --command "node" \
            --args "src/accessibility/server.js" \
            --allow-unauthenticated \
            --min-instances 1 \
            --max-instances 10 \
            --concurrency 500 \
            --cpu 1 \
            --memory 512Mi \
            --timeout 600 \
            --port 8081 \
            --set-env-vars "NODE_ENV=production,USE_MOCKS=true" \
            --quiet
