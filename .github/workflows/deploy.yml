name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

  deploy:
    name: Deploy to Google Cloud Run
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Authentication via Workload Identity Federation (Recommended) or Service Account Key (Fallback)
      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          # Fill in these secrets in your GitHub repository:
          # For Workload Identity Federation (Secure / Keyless):
          # workload_identity_provider: ${{ secrets.GCP_WIP_PROVIDER }}
          # service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          #
          # For Service Account Key (Fallback):
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ secrets.GCP_SERVICE_NAME || 'tap-race' }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ secrets.GCP_REGION || 'us-central1' }}" \
            --source . \
            --allow-unauthenticated \
            --min-instances 1 \
            --max-instances 1 \
            --concurrency 1000 \
            --cpu 1 \
            --memory 512Mi \
            --no-cpu-throttling \
            --timeout 3600 \
            --port 8080 \
            --set-env-vars "ADMIN_TOKEN=${{ secrets.ADMIN_TOKEN }},PERSIST=on" \
            --quiet
