<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#ffffff" />
<title>Tap Race — Host</title>
<link rel="stylesheet" href="/theme.css" />
<style>
  body{min-height:100vh; display:flex; justify-content:center; padding:24px;
    background:radial-gradient(120% 60% at 50% -10%, rgba(66,133,244,.08), transparent 60%), var(--bg);}
  .card{width:min(740px,100%); display:flex; flex-direction:column; gap:16px;}
  .h1{display:flex; align-items:center; gap:10px; font-size:26px; font-weight:700; color:var(--ink); letter-spacing:-.01em;}
  .h1 .cloud{font-size:24px;} .h1 .tag{color:var(--ink-2); font-weight:500;}
  .h1 .gwm{font-size:16px; margin-left:auto;}
  .panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); box-shadow:var(--e1); padding:20px;}
  .row{display:flex; gap:12px; flex-wrap:wrap; align-items:center;}
  label{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); display:block; margin-bottom:6px; font-weight:500;}
  input,select{background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:var(--r-sm);
    padding:12px 14px; font-size:16px; font-weight:500; font-family:var(--font);}
  input{width:170px;} input:focus,select:focus{border-color:var(--g-blue); outline:none;}
  button{border:none; border-radius:var(--r-full); padding:14px 24px; font-size:16px; font-weight:500; cursor:pointer;
    font-family:var(--font); transition:transform .06s, box-shadow .15s, background .15s;}
  button:active{transform:scale(.98);}
  .start{background:var(--g-blue-700); color:#fff; box-shadow:var(--e1); flex:1; min-width:220px; font-weight:700;}
  .start:hover{box-shadow:var(--e2); background:var(--g-blue);}
  .reset{background:var(--surface); color:var(--g-blue-700); border:1px solid var(--line);}
  .reset:hover{background:var(--surface-2);}
  .stat{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
  .stat .b{background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-sm); padding:14px; text-align:center;}
  .stat .k{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-2); font-weight:500;}
  .stat .v{font-size:30px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--ink);}
  .phase{font-weight:700; text-transform:uppercase; letter-spacing:.06em;}
  .phase.lobby{color:var(--ink-2);} .phase.countdown{color:var(--g-yellow-700);} .phase.running{color:var(--g-green-700);} .phase.ended{color:var(--g-blue-700);}
  .links{display:flex; gap:18px; align-items:center; flex-wrap:wrap;}
  .qr{background:#fff; padding:10px; border-radius:var(--r-sm); width:150px; height:150px; border:1px solid var(--line);}
  .qr svg{width:100%; height:100%; display:block;}
  a{color:var(--g-blue-700); font-weight:500; text-decoration:none; font-size:18px;}
  a:hover{text-decoration:underline;}
  .msg{min-height:20px; font-weight:500;}
  .msg.ok{color:var(--g-green-700);} .msg.err{color:var(--g-red-700);}
  .hint{color:var(--ink-2); font-size:13px;}
  .panel h2{margin:0 0 14px; font-size:16px; font-weight:700; color:var(--ink); display:flex; align-items:center; gap:6px;}
  .rank{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
  .rank li{display:grid; grid-template-columns:2.2em 1.4em 1fr auto; align-items:center; gap:12px;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r-sm); padding:10px 14px; position:relative; overflow:hidden;}
  .rank li.r1{border-color:var(--g-yellow); box-shadow:var(--e1);}
  .rank li .rk{justify-self:center; min-width:1.7em; height:1.7em; display:flex; align-items:center; justify-content:center;
    border-radius:50%; font-weight:700; color:#fff; background:var(--ink-3); font-size:14px; font-variant-numeric:tabular-nums;}
  .rank li.r1 .rk{background:var(--g-yellow); color:#3c2c00;} .rank li.r2 .rk{background:var(--g-blue);} .rank li.r3 .rk{background:var(--g-green);}
  .rank li .em{font-size:20px;}
  .rank li .nm{font-weight:500; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rank li .nm .seq{color:var(--ink-3); font-weight:500; font-size:.8em;}
  .rank li .ct{font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums;}
  .rank li.empty{display:block; color:var(--ink-2); font-weight:500; text-align:center; background:var(--surface-2);}
</style>
</head>
<body>
  <div class="card">
    <div class="h1"><span class="cloud">☁️</span> Tap Race <span class="tag">· Host</span>
      <span class="gwm"><span class="b">G</span><span class="r">o</span><span class="y">o</span><span class="b">g</span><span class="g">l</span><span class="r">e</span> <span class="cloud">Cloud</span></span>
    </div>

    <div class="panel">
      <div class="row">
        <div><label>Token admin</label><input id="token" placeholder="token admin" autocomplete="off" /></div>
        <div><label>Duração</label>
          <select id="dur">
            <option value="15000">15 s</option>
            <option value="30000" selected>30 s</option>
            <option value="45000">45 s</option>
            <option value="60000">60 s</option>
          </select>
        </div>
      </div>
      <div class="row" style="margin-top:16px;">
        <button class="start" id="start">▶ Iniciar (3 · 2 · 1 · VAI)</button>
        <button class="reset" id="reset">↺ Resetar p/ lobby</button>
      </div>
      <div class="msg" id="msg"></div>
      <div class="hint">Dica: deixe a <a href="/screen" target="_blank">/screen</a> no telão. Iniciar zera os contadores e dispara a contagem.</div>
    </div>

    <div class="panel">
      <div class="row" style="justify-content:space-between;">
        <div>Estado: <span class="phase lobby" id="phase">LOBBY</span></div>
      </div>
      <div class="stat" style="margin-top:14px;">
        <div class="b"><div class="k">Jogadores</div><div class="v" id="players">0</div></div>
        <div class="b"><div class="k">Toques</div><div class="v" id="taps">0</div></div>
        <div class="b"><div class="k">Tempo</div><div class="v" id="time">—</div></div>
      </div>
    </div>

    <div class="panel">
      <h2>🏆 Ranking ao vivo</h2>
      <ol class="rank" id="rank"><li class="empty">Sem jogadores ainda…</li></ol>
    </div>

    <div class="panel">
      <div class="links">
        <div class="qr" id="qr"></div>
        <div>
          <label>Link do jogador</label>
          <a id="phoneurl" href="/" target="_blank">/</a>
          <div style="margin-top:14px;"><label>Telão</label><a href="/screen" target="_blank">/screen</a></div>
        </div>
      </div>
    </div>
  </div>

<script>
(()=>{
  const $=(id)=>document.getElementById(id);
  const origin=location.origin;
  $('phoneurl').textContent=origin.replace(/^https?:\/\//,'');
  $('phoneurl').href=origin;
  fetch('/qr.svg?data='+encodeURIComponent(origin)).then(r=>r.text()).then(s=>$('qr').innerHTML=s).catch(()=>{});
  // Prefill the admin token straight from the server so the host has zero friction.
  fetch('/config').then(r=>r.json()).then(c=>{ if(c.adminToken && !$('token').value) $('token').value=c.adminToken; }).catch(()=>{});
  const esc=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  let clockOffset=0, st={phase:'lobby'};
  function msg(t,ok){ const m=$('msg'); m.textContent=t; m.className='msg '+(ok?'ok':'err'); }

  async function post(path){
    try{
      const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','x-admin-token':$('token').value},
        body:JSON.stringify({durationMs:Number($('dur').value)})});
      if(r.status===401){ msg('Token admin incorreto.',false); return; }
      await r.json(); msg(path==='/admin/start'?'Rodada iniciada! 🚀':'Resetado para lobby.',true);
    }catch(e){ msg('Falha de rede.',false); }
  }
  $('start').onclick=()=>post('/admin/start');
  $('reset').onclick=()=>post('/admin/reset');

  function connect(){
    const es=new EventSource('/events');
    es.onmessage=(e)=>{ try{ render(JSON.parse(e.data)); }catch(_){}};
    es.onerror=()=>{ es.close(); setTimeout(connect,1500); };
  }
  function render(s){
    if(typeof s.serverNow==='number') clockOffset=s.serverNow-Date.now();
    st=s;
    $('phase').textContent=s.phase.toUpperCase();
    $('phase').className='phase '+s.phase;
    $('players').textContent=s.total;
    $('taps').textContent=(s.totalTaps||0).toLocaleString('pt-BR');
    renderRank(s.top||[]);
  }
  function renderRank(top){
    const ol=$('rank');
    if(!top.length){ ol.innerHTML='<li class="empty">Sem jogadores ainda…</li>'; return; }
    ol.innerHTML=top.map(p=>{
      const cls=p.rank===1?' r1':p.rank===2?' r2':p.rank===3?' r3':'';
      return `<li class="rank-item${cls}"><span class="rk">${p.rank}</span><span class="em">${p.emoji||''}</span><span class="nm">${esc(p.name)} <span class="seq">#${p.seq}</span></span><span class="ct">${(p.count||0).toLocaleString('pt-BR')}</span></li>`;
    }).join('');
  }
  function tick(){
    const now=Date.now()+clockOffset;
    if(st.phase==='running'&&st.endsAt) $('time').textContent=Math.max(0,Math.ceil((st.endsAt-now)/1000))+'s';
    else if(st.phase==='countdown'&&st.startsAt) $('time').textContent=Math.max(0,Math.ceil((st.startsAt-now)/1000));
    else $('time').textContent='—';
    requestAnimationFrame(tick);
  }
  connect(); requestAnimationFrame(tick);
})();
</script>
</body>
</html>
