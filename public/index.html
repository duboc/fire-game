<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Tap Race</title>
<!-- No external font link: Roboto is self-hosted in theme.css and is next in
     the --font-display stack. Event wifi is the one thing we cannot fix, and a
     render-blocking request to a third-party font host is a blank phone. -->
<link rel="stylesheet" href="/theme.css" />
<style>
  html,body{height:100%;}
  body{
    overflow:hidden; overscroll-behavior:none; touch-action:manipulation;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
    display:flex; flex-direction:column;
    --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
    background:radial-gradient(130% 70% at 50% -20%, rgba(66,133,244,.18), transparent 60%), var(--bg);
  }
  .appbar{display:flex; align-items:center; gap:8px; padding:calc(12px + var(--safe-top)) 18px 4px;}
  .appbar .cloud{font-size:18px; line-height:1;}
  .appbar .title{font-family:var(--font-display); font-weight:700; font-size:18px; color:var(--ink); margin-right:auto; letter-spacing:-.01em;}
  .appbar .gwm{font-size:14px;}
  .wrap{flex:1; display:flex; flex-direction:column; padding:8px 16px calc(16px + var(--safe-bot)); gap:12px; min-height:0;}

  .id-card{background:var(--surface-glass); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid var(--line);
    border-radius:var(--r-lg); box-shadow:var(--e1); text-align:center; padding:14px;}
  .id-card .who{font-size:11px; letter-spacing:.14em; color:var(--ink-2); text-transform:uppercase; font-weight:500;}
  /* Three words now ("Baronesa Capivara Furiosa"), so it is sized to wrap to a
     second line rather than to shove the tap area off a small screen. */
  .id-card .name{font-family:var(--font-display); font-size:clamp(19px,5.6vw,26px); font-weight:700; line-height:1.15; margin-top:4px; color:var(--ink);
    text-wrap:balance; overflow-wrap:break-word;}
  .id-card .seq{font-family:var(--font-mono); color:var(--g-blue-700); font-weight:500;}

  .hud{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  .stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); box-shadow:var(--e1); padding:12px 6px; text-align:center;}
  .stat .k{font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); font-weight:500;}
  .stat .v{font-family:var(--font-mono); font-size:clamp(22px,6.5vw,30px); font-weight:500; font-variant-numeric:tabular-nums; line-height:1.15; color:var(--ink);}
  .stat.rank .v{color:var(--g-blue-700);}
  .stat.count .v{color:var(--g-green-700);}

  .timewrap{height:8px; border-radius:var(--r-full); background:var(--surface-2); overflow:hidden; border:1px solid var(--line);}
  .timebar{height:100%; width:100%; border-radius:var(--r-full); background:linear-gradient(90deg,#EA4335,#FBBC04,#34A853,#4285F4);}

  .arena{flex:1; display:flex; align-items:center; justify-content:center; position:relative; min-height:0;}
  .btn{
    position:relative; width:min(76vw,330px); aspect-ratio:1/1; border-radius:50%; border:none;
    color:#fff; font-family:var(--font-display); font-weight:700; font-size:clamp(30px,9vw,46px); letter-spacing:.02em;
    background:radial-gradient(circle at 38% 30%, #5e9bff, var(--primary) 44%, var(--primary-dark));
    box-shadow:0 18px 50px rgba(0,0,0,.6), var(--glow-strong), 0 0 0 1px rgba(66,133,244,.4);
    touch-action:none; cursor:pointer; transition:transform .06s ease, box-shadow .15s ease;
    display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.05;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:not(.disabled){animation:glowPulse 2.6s ease-in-out infinite;}
  .btn:active{transform:scale(.94); box-shadow:0 8px 24px rgba(0,0,0,.6), 0 0 30px rgba(66,133,244,.45), 0 0 0 1px rgba(66,133,244,.5);}
  .btn.disabled{background:radial-gradient(circle at 38% 30%, #2c2c2e, #1a1a1a); color:var(--ink-3); pointer-events:none;
    box-shadow:0 8px 24px rgba(0,0,0,.5), 0 0 0 1px var(--line);}
  .btn .pulse{position:absolute; inset:-2px; border-radius:50%; border:3px solid rgba(66,133,244,.45); animation:pulse 1.5s ease-out infinite;}
  @keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.45);opacity:0}}

  .float{position:absolute; pointer-events:none; font-family:var(--font-mono); font-weight:700; font-size:30px; color:var(--g-blue-700);
    text-shadow:0 0 14px rgba(66,133,244,.5); animation:floatUp .7s ease-out forwards;}
  @keyframes floatUp{0%{opacity:1; transform:translateY(0) scale(1)}100%{opacity:0; transform:translateY(-90px) scale(1.5)}}

  .status{text-align:center; min-height:22px; font-weight:500; color:var(--ink-2); font-size:15px;}
  .status.go{color:var(--g-green-700); font-weight:700;} .status.end{color:var(--g-blue-700); font-weight:700;}

  .overlay{position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column;
    background:rgba(0,0,0,.92); backdrop-filter:blur(8px); z-index:50;}
  .overlay.show{display:flex;}
  .cd{font-family:var(--font-mono); font-size:clamp(140px,46vw,260px); font-weight:500; line-height:1; color:var(--g-blue); animation:cdpop .9s ease-out;}
  .cd.n3{color:var(--g-blue); text-shadow:0 0 40px rgba(66,133,244,.5);}
  .cd.n2{color:var(--g-red); text-shadow:0 0 40px rgba(234,67,53,.45);}
  .cd.n1{color:var(--g-yellow); text-shadow:0 0 40px rgba(251,188,4,.45);}
  .cd.go{color:var(--g-green); text-shadow:0 0 50px rgba(52,168,83,.55);}
  @keyframes cdpop{0%{transform:scale(.3);opacity:0}40%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
  .cd-sub{color:var(--ink-2); font-weight:500; letter-spacing:.14em; text-transform:uppercase; margin-top:10px;}

  .hidden{display:none !important;}
</style>
</head>
<body class="noise-bg">
  <div class="appbar">
    <span class="cloud">☁️</span>
    <span class="title shimmer">Tap Race</span>
    <span class="gwm"><span class="b">G</span><span class="r">o</span><span class="y">o</span><span class="b">g</span><span class="g">l</span><span class="r">e</span> <span class="cloud">Cloud</span></span>
  </div>
  <div class="wrap">
    <div class="id-card">
      <div class="who">You are</div>
      <div class="name"><span class="emoji" id="emoji">🎮</span> <span id="name">Connecting…</span> <span class="seq" id="seq"></span></div>
    </div>

    <div class="hud">
      <div class="stat rank"><div class="k">Rank</div><div class="v" id="rank">—</div></div>
      <div class="stat count"><div class="k">Taps</div><div class="v" id="count">0</div></div>
      <div class="stat"><div class="k">Players</div><div class="v" id="total">—</div></div>
    </div>

    <div class="timewrap" id="timewrap"><div class="timebar" id="timebar"></div></div>

    <div class="arena" id="arena">
      <button class="btn disabled" id="btn" aria-label="Tap button">
        <span class="pulse hidden" id="pulse"></span>
        <span id="btnlabel">WAIT</span>
      </button>
    </div>

    <div class="status" id="status">Waiting for the host to start…</div>
  </div>

  <div class="overlay" id="overlay">
    <div class="cd n3" id="cd">3</div>
    <div class="cd-sub" id="cdsub">Finger ready…</div>
  </div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const els = {
    emoji:$('emoji'), name:$('name'), seq:$('seq'),
    rank:$('rank'), count:$('count'), total:$('total'),
    btn:$('btn'), btnlabel:$('btnlabel'), pulse:$('pulse'), arena:$('arena'),
    status:$('status'), timebar:$('timebar'), timewrap:$('timewrap'),
    overlay:$('overlay'), cd:$('cd'), cdsub:$('cdsub'),
  };

  // Constructed once: tweenCounts-style repaints call this on every frame, and
  // building a formatter per call is a real cost at 60fps.
  const NUM = new Intl.NumberFormat('en');
  const fmt = (v) => NUM.format(Number(v) || 0);

  const PHASE = { LOBBY:'lobby', COUNTDOWN:'countdown', RUNNING:'running', ENDED:'ended' };

  let me = { id: localStorage.getItem('tapId') || null, name:'', emoji:'', seq:0 };
  let clockOffset = 0;            // estimated (serverNow - Date.now()), RTT-compensated
  let bestRtt = Infinity;         // least-delayed sample seen; see syncClock
  let pending = 0;                // taps not yet flushed
  let localTaps = 0;             // optimistic running total this round
  let serverCount = 0;
  let state = { phase: PHASE.LOBBY, startsAt:null, endsAt:null, settlesAt:null, settled:true, graceMs:1500,
                durationMs:30000, countdownMs:3000, total:0, tapIntervalMs:150, pollIntervalMs:600 };
  let finalJitter = null;         // this phone's personal delay for the last flush
  let myRank = null;              // kept as a number so it can be re-grouped on a language switch
  let seenState = false;
  let lastRoundSeenRunning = false;
  let lastCdShown = null;
  let myRoundId = null;
  let reregistering = false;

  const estServerNow = () => Date.now() + clockOffset;

  // NTP-style clock sync. The naive `serverNow - Date.now()` is wrong by exactly
  // one-way latency, which made every distant player start late AND get cut off
  // early — a systematic bias against whoever is furthest from the region.
  // serverNow was stamped roughly rtt/2 ago, so add that back, and keep only the
  // least-delayed sample: a fast round trip is the least distorted by queueing.
  function syncClock(serverNow, t0, t1){
    if (typeof serverNow !== 'number') return;
    const rtt = t1 - t0;
    if (rtt < 0 || rtt > 5000) return; // nonsense sample (suspended tab, dead link)
    // If the device clock itself jumped (NTP correction, user edit), every past
    // sample is void — start the search over rather than trusting a stale min.
    if (Math.abs((serverNow - t1) - clockOffset) > 5000) bestRtt = Infinity;
    if (rtt > bestRtt) return;
    bestRtt = rtt;
    clockOffset = serverNow + rtt / 2 - t1;
  }

  // Every response is a clock sample, so there is no separate sync traffic —
  // at 5.000 players we cannot afford extra requests just to measure latency.
  //
  // The timeout is not politeness, it is load control. fetch() has no default
  // one, so a stalled request hangs for minutes; the loop below would keep
  // firing new ones on top, and 5.000 phones each stacking dead requests turns
  // a one-second server hiccup into a stampede exactly when it cannot absorb
  // it. Give up quickly instead — nothing is lost, the caller re-queues.
  async function apiJson(url, opts, timeoutMs){
    const t0 = Date.now();
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), timeoutMs || 8000);
    try{
      const r = await fetch(url, Object.assign({ signal: ctl.signal }, opts));
      const s = await r.json();
      syncClock(s && s.serverNow, t0, Date.now());
      return s;
    } finally { clearTimeout(timer); }
  }

  function applyState(s){
    if (!s) return;
    // Server forgot us (restart between rounds): re-register so /state recovers too.
    if (s.known === false && me.id) reregister();
    // New round: drop optimistic counts so they never carry over (back-to-back rounds
    // skip the lobby, so we key off roundId, not the lobby branch).
    if (typeof s.roundId === 'number' && s.roundId !== myRoundId){
      myRoundId = s.roundId; localTaps = 0; serverCount = 0; finalJitter = null;
    }
    state = Object.assign(state, {
      phase:s.phase, startsAt:s.startsAt, endsAt:s.endsAt,
      settlesAt:s.settlesAt, settled:s.settled !== false,
      graceMs: s.graceMs != null ? s.graceMs : state.graceMs,
      durationMs:s.durationMs, countdownMs:s.countdownMs, total:s.total,
      // Server-driven cadence: the room's size decides how often we may call.
      tapIntervalMs: s.tapIntervalMs || state.tapIntervalMs,
      pollIntervalMs: s.pollIntervalMs || state.pollIntervalMs,
    });
    if (typeof s.yourCount === 'number') serverCount = s.yourCount;
    if (typeof s.yourRank === 'number') myRank = s.yourRank;
    if (typeof s.total === 'number') seenState = true;
    renderNumbers();
    if (s.name && (s.rejoined || !me.name)) setIdentity(s);
    render();
  }

  function renderNumbers(){
    if (myRank != null) els.rank.textContent = '#' + fmt(myRank);
    if (seenState) els.total.textContent = fmt(state.total);
    els.count.textContent = fmt(state.settled ? serverCount : Math.max(serverCount, localTaps));
  }

  async function reregister(){
    // Guarded by `reregistering`, so it also needs the timeout: a hung /join
    // would otherwise leave the flag set and the phone unable to ever recover.
    if (reregistering) return; reregistering = true;
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 8000);
    try{
      const r = await fetch(joinUrl(), { method:'POST', signal: ctl.signal });
      const s = await r.json();
      localTaps = 0; serverCount = 0; myRoundId = null;
      setIdentity(s);
    }catch(_){ /* retry on next loop */ }
    finally{ clearTimeout(timer); reregistering = false; }
  }

  function setIdentity(s){
    if (s.id){ me.id = s.id; localStorage.setItem('tapId', s.id); }
    me.name = s.name || me.name; me.emoji = s.emoji || me.emoji; me.seq = s.seq || me.seq;
    els.emoji.textContent = me.emoji || '🎮';
    els.name.textContent = me.name || '—';
    els.seq.textContent = me.seq ? ('#' + me.seq) : '';
  }

  // The interface is English, but names are still minted in the visitor's own
  // language from Accept-Language. `?lang=` on the page forwards to the join so
  // a shared link can pin the name language too: /?lang=de.
  function joinUrl(){
    let l = null;
    try{ l = new URLSearchParams(location.search).get('lang'); }catch(_){}
    return l ? '/join?lang=' + encodeURIComponent(l) : '/join';
  }

  // ---- networking ---------------------------------------------------------
  async function join(){
    try{
      // try to resume an existing identity first
      if (me.id){
        const s = await apiJson('/state?id='+encodeURIComponent(me.id));
        if (s.known){ setIdentity(s); applyState(s); return; }
      }
      const s = await apiJson(joinUrl(), { method:'POST' });
      setIdentity(s);
    }catch(e){ els.status.textContent = 'No connection… retrying'; }
  }

  // One request of each kind in flight at a time. The loop is on a timer, so
  // without this a slow response silently becomes two, then four, concurrent
  // requests from the same phone. Taps are never lost by skipping: they stay in
  // `pending` and ride along with the next flush.
  let tapInFlight = false, pollInFlight = false;

  // Allow two cadence intervals before declaring a request dead, so a phone that
  // has been told to back off to 3s (a 5.000-player room) is not aborting
  // perfectly healthy requests.
  const netTimeout = () => Math.max(5000, state.tapIntervalMs * 2);

  async function flushTaps(){
    if (tapInFlight) return;
    const n = pending; pending = 0;
    tapInFlight = true;
    try{
      const s = await apiJson('/tap', {
        method:'POST', keepalive:true,
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ id: me.id, n }),
      }, netTimeout());
      if (s.rejoined){ localTaps = 0; }
      applyState(s);
    }catch(e){ pending += n; /* retry next loop */ }
    finally{ tapInFlight = false; }
  }

  async function pollState(){
    if (pollInFlight) return;
    pollInFlight = true;
    try{
      applyState(await apiJson('/state?id='+encodeURIComponent(me.id||''), null, netTimeout()));
    }catch(e){}
    finally{ pollInFlight = false; }
  }

  // The server is authoritative, but at event scale a poll can be seconds away,
  // so we cross the start/end boundaries on the synced clock instead of waiting
  // to be told. Everyone's button therefore goes live — and dies — together.
  function localPhase(){
    const now = estServerNow();
    let p = state.phase;
    // Chained, not exclusive: a phone that was suspended across the whole round
    // must land on ENDED, not wake up thinking the button is live.
    if (p === PHASE.COUNTDOWN && state.startsAt != null && now >= state.startsAt) p = PHASE.RUNNING;
    if (p === PHASE.RUNNING && state.endsAt != null && now >= state.endsAt) p = PHASE.ENDED;
    return p;
  }

  // single adaptive loop
  function loop(){
    const p = localPhase();
    let delay = state.pollIntervalMs;
    if (p === PHASE.RUNNING){
      // Flush on the server's cadence, but never sleep past the buzzer — the
      // last batch has to land inside the grace window.
      //
      // Waking *exactly* at endsAt would be the obvious thing and is wrong at
      // scale: every phone is clock-synced, so all of them would fire at the
      // same instant and the server would spend longer draining that one herd
      // than the whole window lasts (measured 2.107ms for 5.000; docs/SCALE.md,
      // finding 8). Credit depends on when a tap was *made*, not when it lands,
      // so each phone waits its own slice of the window and nothing is lost but
      // a moment of suspense. The slice tracks the cadence the server handed
      // out, which is already a measure of how crowded the room is.
      const remain = state.endsAt != null ? state.endsAt - estServerNow() : Infinity;
      delay = Math.max(30, Math.min(state.tapIntervalMs, remain));
      if (remain <= state.tapIntervalMs && remain > 0){
        if (finalJitter == null) finalJitter = Math.random() * Math.min(state.tapIntervalMs, state.graceMs * 0.6);
        delay = Math.max(30, remain + finalJitter);
      }
      flushTaps();
    } else if (p === PHASE.ENDED){
      // Getting the final batch in beats learning the result a second sooner.
      if (pending > 0){ delay = 250; flushTaps(); }
      else pollState();
    } else { // lobby / countdown — cheap, and the countdown runs off the local clock
      pollState();
    }
    setTimeout(loop, delay);
  }

  // ---- input --------------------------------------------------------------
  // vibrate only when the page has a user gesture (avoids the browser's
  // "Blocked call to navigator.vibrate" intervention before the first tap)
  function vibe(ms){
    try{
      if (!navigator.vibrate) return;
      const ua = navigator.userActivation;
      if (ua && !ua.hasBeenActive) return;
      navigator.vibrate(ms);
    }catch(_){}
  }
  function onTap(e){
    e.preventDefault();
    // Gated on the synced clock, not the last poll: a phone whose poll is in
    // flight must not keep scoring after the buzzer, and must not be blocked
    // for the first second of the round while it waits to hear the start.
    if (localPhase() !== PHASE.RUNNING) return;
    pending++; localTaps++;
    serverCount = Math.max(serverCount, localTaps);
    els.count.textContent = fmt(serverCount);
    bounce(); floatPlus(e); vibe(12);
  }
  els.btn.addEventListener('pointerdown', onTap, { passive:false });
  els.btn.addEventListener('touchstart', (e)=>e.preventDefault(), { passive:false });
  els.btn.addEventListener('contextmenu', (e)=>e.preventDefault());

  function bounce(){ els.btn.style.transform='scale(.94)'; clearTimeout(bounce._t); bounce._t=setTimeout(()=>els.btn.style.transform='',60); }
  function floatPlus(e){
    const f=document.createElement('div'); f.className='float'; f.textContent='+1';
    const r=els.arena.getBoundingClientRect();
    const x=(e.clientX||r.left+r.width/2)-r.left, y=(e.clientY||r.top+r.height/2)-r.top;
    f.style.left=(x-10)+'px'; f.style.top=(y-20)+'px';
    els.arena.appendChild(f); setTimeout(()=>f.remove(),700);
  }

  // ---- render -------------------------------------------------------------
  function render(){
    const p = localPhase();
    // countdown overlay
    if (p === PHASE.COUNTDOWN){
      const ms = state.startsAt - estServerNow();
      const num = Math.ceil(ms/1000);
      els.overlay.classList.add('show');
      const shown = num > 0 ? String(num) : 'GO!';
      if (shown !== lastCdShown){
        lastCdShown = shown;
        els.cd.textContent = shown;
        els.cd.className = 'cd ' + (num>=3?'n3':num===2?'n2':num===1?'n1':'go'); // Google color per count
        els.cd.style.animation='none'; void els.cd.offsetWidth; els.cd.style.animation='';
        vibe(num>0?20:60);
      }
      els.cdsub.textContent = num>0 ? 'Finger ready…' : '';
    } else {
      els.overlay.classList.remove('show'); lastCdShown=null;
    }

    // button + status
    if (p === PHASE.RUNNING){
      lastRoundSeenRunning = true;
      els.btn.classList.remove('disabled'); els.pulse.classList.add('hidden');
      els.btnlabel.textContent = 'TAP!';
      els.status.className='status go'; els.status.textContent = 'GO GO GO! 🔥';
    } else if (p === PHASE.ENDED){
      els.btn.classList.add('disabled'); els.pulse.classList.add('hidden');
      els.btnlabel.textContent = "TIME'S UP!";
      els.status.className='status end';
      // Don't announce a position while late batches can still reorder it.
      els.status.textContent = !state.settled
        ? 'Counting the last taps… ⏳'
        : (myRank != null
          ? 'You finished #' + fmt(myRank) + ' • Look at the screen! 🏆'
          : 'Game over! Look at the screen 🏆');
    } else if (p === PHASE.COUNTDOWN){
      els.btn.classList.add('disabled'); els.btnlabel.textContent = 'ALMOST…';
      els.status.className='status'; els.status.textContent = 'Get ready!';
    } else { // lobby
      // new round reset
      if (lastRoundSeenRunning){ lastRoundSeenRunning=false; localTaps=0; serverCount=0; }
      els.btn.classList.add('disabled'); els.pulse.classList.remove('hidden');
      els.btnlabel.textContent = 'WAIT';
      els.status.className='status'; els.status.textContent = 'Waiting for the host to start…';
    }
    // Optimistic (instant) until the server declares the round settled — at
    // which point its count is final and includes our late batch, so we switch
    // to it and agree with the big screen at the climax. Keying this on `settled`
    // rather than the phase is what stops the number visibly dipping at the
    // buzzer and then climbing back once the last flush is acknowledged.
    els.count.textContent = fmt(state.settled ? serverCount : Math.max(serverCount, localTaps));
  }

  // smooth time bar via rAF
  let lastFramePhase = null;
  function frame(){
    const p = localPhase();
    // Repaint the instant the local clock crosses a boundary, without waiting
    // for the next poll to confirm it.
    if (p !== lastFramePhase){ lastFramePhase = p; render(); }
    if (p === PHASE.RUNNING && state.endsAt){
      const remain = Math.max(0, state.endsAt - estServerNow());
      const frac = Math.max(0, Math.min(1, remain / state.durationMs));
      els.timebar.style.width = (frac*100).toFixed(2)+'%';
      els.timewrap.style.opacity='1';
      // re-check countdown -> ended edge for snappier UI
      render();
    } else if (p === PHASE.COUNTDOWN){
      els.timewrap.style.opacity='.4'; els.timebar.style.width='100%'; render();
    } else {
      els.timewrap.style.opacity='.25'; els.timebar.style.width = p===PHASE.ENDED?'0%':'100%';
    }
    requestAnimationFrame(frame);
  }

  // flush on background/close so final taps count (the climax!)
  function flushBeacon(){
    if (pending<=0 || !me.id) return;
    const body = JSON.stringify({ id: me.id, n: pending });
    // Bank the batch only if the browser actually took it. sendBeacon returns
    // false when its queue is full and is missing outright on some in-app
    // webviews — clearing `pending` first threw the last batch of the round
    // away silently, on exactly the phones already having a bad time. If it is
    // refused the taps stay pending: a backgrounded tab that comes back still
    // flushes them, which is strictly better than losing them here.
    let sent = false;
    try{
      sent = !!navigator.sendBeacon
        && navigator.sendBeacon('/tap', new Blob([body],{type:'application/json'}));
    }catch(_){}
    if (sent) pending = 0;
  }
  document.addEventListener('visibilitychange', ()=>{ if (document.hidden) flushBeacon(); });
  window.addEventListener('pagehide', flushBeacon);

  // boot
  (async ()=>{ await join(); render(); loop(); requestAnimationFrame(frame); })();
})();
</script>
</body>
</html>
