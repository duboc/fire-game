<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#000000" />
<title>Sequência — Tela</title>
<!-- Roboto is self-hosted in theme.css; no external font request. -->
<link rel="stylesheet" href="/theme.css" />
<style>
  html,body{height:100%;}
  body{overflow:hidden; background:radial-gradient(circle at 50% -8%, rgba(66,133,244,.18), transparent 55%), var(--bg);}
  #confetti{position:fixed; inset:0; pointer-events:none; z-index:60;}

  .stage{position:absolute; inset:0; display:none; flex-direction:column; padding:4vh 5vw; align-items:center; justify-content:center; gap:2.4vh; text-align:center;}
  .stage.show{display:flex;}

  .brand{display:flex; align-items:center; gap:.6vw; font-family:var(--font-display); font-size:clamp(26px,3.2vw,46px); font-weight:700; color:var(--ink); letter-spacing:-.01em; position:absolute; top:4vh; left:5vw;}

  .chip{background:var(--surface-glass); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid var(--line); border-radius:var(--r-md); box-shadow:var(--e1); padding:10px 22px; text-align:center;}
  .chip .k{font-size:clamp(10px,1vw,15px); text-transform:uppercase; letter-spacing:.08em; color:var(--ink-2); font-weight:500;}
  .chip .v{font-family:var(--font-mono); font-size:clamp(22px,2.6vw,42px); font-weight:500; font-variant-numeric:tabular-nums; line-height:1.1; color:var(--ink);}
  .chips{display:flex; gap:1.2vw; position:absolute; top:4vh; right:5vw;}
  .chip.timer .v{color:var(--g-blue-700);} .chip.timer.low .v{color:var(--g-red); animation:blink .6s steps(2) infinite;}
  @keyframes blink{50%{opacity:.35}}

  /* ===== LOBBY ===== */
  #lobby .big{display:flex; align-items:center; gap:1.4vw; font-family:var(--font-display); font-size:clamp(40px,6.5vw,104px); font-weight:700; letter-spacing:-.02em;}
  #lobby .sub{font-size:clamp(18px,2.2vw,32px); color:var(--ink-2); font-weight:500;}
  .qr{background:#fff; padding:18px; border-radius:var(--r-lg); width:min(34vh,320px); height:min(34vh,320px); box-shadow:0 0 50px rgba(66,133,244,.25); border:1px solid rgba(66,133,244,.3);}
  .qr svg{width:100%; height:100%; display:block;}
  .ready{font-size:clamp(22px,2.8vw,42px); font-weight:500; color:var(--ink);}
  .ready b{font-family:var(--font-mono); color:var(--g-green-700); font-weight:500; font-variant-numeric:tabular-nums;}

  /* ===== COUNTDOWN ===== */
  #cdnum{font-family:var(--font-mono); font-size:min(58vh,44vw); font-weight:500; line-height:.9; color:var(--g-blue);}
  #cdnum.n3{color:var(--g-blue);} #cdnum.n2{color:var(--g-red);} #cdnum.n1{color:var(--g-yellow);} #cdnum.go{color:var(--g-green);}
  .cdpop{animation:cdpop .8s cubic-bezier(.2,1.3,.4,1);}
  @keyframes cdpop{0%{transform:scale(.2);opacity:0}45%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}

  /* ===== color tiles (memorize / recall / reveal) — classic Simon Says =====
     The flash must be unmissable from the back of a room: at rest the tiles
     are nearly extinguished, and the lit one pops in size, gains a thick
     white ring and floods its own color as glow. Contrast carries further
     than brightness alone on a washed-out projector. ===== */
  .roundtag{font-family:var(--font-mono); font-size:clamp(22px,2.8vw,40px); color:var(--g-blue-700); font-weight:500;}
  .tiles{display:flex; gap:2vw; flex-wrap:wrap; justify-content:center; padding:3vh 0;}
  .tile{width:min(18vw,220px); aspect-ratio:1/1; border-radius:var(--r-xl); opacity:.22; transform:scale(.9);
    transition:opacity .08s ease, transform .08s ease, filter .08s ease; box-shadow:0 10px 30px rgba(0,0,0,.4);}
  .tile.lit{opacity:1; transform:scale(1.22); filter:brightness(1.45) saturate(1.25);
    box-shadow:0 0 0 8px rgba(255,255,255,.95), 0 0 110px 30px currentColor, 0 10px 30px rgba(0,0,0,.5);
    animation:tilepop .22s ease-out;}
  @keyframes tilepop{0%{transform:scale(.9)}55%{transform:scale(1.32)}100%{transform:scale(1.22)}}
  /* opening cue — the instruction owns the screen, blinking, until the
     action starts. This is what tells a first-timer WHAT to do before the
     moment they must already be doing it. */
  .bigcue{font-family:var(--font-display); font-size:clamp(44px,6.4vw,108px); font-weight:700; color:var(--ink);
    text-align:center; text-wrap:balance; max-width:90vw; animation:cuepulse 1.1s ease-in-out infinite;}
  @keyframes cuepulse{0%,100%{opacity:.45; transform:scale(.97)}50%{opacity:1; transform:scale(1.04)}}
  .bigcue.go{animation:cdpop .5s cubic-bezier(.2,1.3,.4,1); color:var(--g-green-700); opacity:1;}
  .cuedetail{font-size:clamp(22px,2.9vw,46px); color:var(--ink); font-weight:500; max-width:82vw; text-align:center;}

  /* which symbol of the sequence we're on — fills as the flashes go by */
  .mdots{display:flex; gap:1.2vw; justify-content:center;}
  .mdots .md{width:clamp(14px,1.6vw,24px); height:clamp(14px,1.6vw,24px); border-radius:50%;
    background:var(--surface-2); border:1px solid var(--line);}
  .mdots .md.done{background:var(--g-blue); box-shadow:0 0 14px rgba(66,133,244,.6);}

  .subtext{font-size:clamp(18px,2.2vw,30px); color:var(--ink-2); font-weight:500;}

  /* the round's hero — big card, big name, the deed underneath */
  .vhero{display:flex; align-items:center; gap:2vw; max-width:92vw; background:var(--surface-glass);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid rgba(66,133,244,.35);
    box-shadow:var(--e3), var(--glow-strong); border-radius:var(--r-xl); padding:2.2vh 3.5vw;
    animation:cdpop .7s cubic-bezier(.2,1.3,.4,1);}
  .vhero .em{font-size:min(15vh,12vw); flex:none;}
  .vhero .info{text-align:left; min-width:0;}
  .vhero .nm{font-family:var(--font-display); font-size:clamp(30px,4.4vw,76px); font-weight:700; line-height:1.06;
    color:var(--ink); text-wrap:balance; overflow-wrap:break-word;}
  .vhero .nm .seq{font-family:var(--font-mono); color:var(--ink-2); font-size:.55em;}
  .vhero .deed{font-family:var(--font-mono); font-size:clamp(18px,2.4vw,38px); font-weight:500; color:var(--g-green-700); margin-top:.4vh;}
  .vhero.none{border-color:var(--line); box-shadow:var(--e2);}
  .vhero.none .nm{color:var(--ink-2);}

  /* live answer pulse during RECALL — the room watching itself finish */
  .pulsewrap{width:min(60vw,900px); height:14px; border-radius:var(--r-full); background:var(--surface-2);
    border:1px solid var(--line); overflow:hidden;}
  .pulsebar{height:100%; width:0%; border-radius:var(--r-full); background:linear-gradient(90deg,#34A853,#4285F4);
    transition:width .25s ease;}

  /* floating crowd reactions — Instagram-live style, pointer-through.
     Spawned in a center band, not across the full width: the middle of the
     screen is where every eye already is, so that is where the crowd shows. */
  #fx{position:fixed; inset:0; pointer-events:none; z-index:55; overflow:hidden;}
  .fx{position:absolute; bottom:-8vh; font-size:clamp(36px,4.2vw,68px); opacity:0;
    animation:fxup 3.4s ease-out forwards; will-change:transform,opacity;}
  @keyframes fxup{0%{transform:translateY(0) scale(.8); opacity:0}10%{opacity:1}
    100%{transform:translateY(-105vh) scale(1.3) rotate(var(--fxr,0deg)); opacity:0}}
  /* an answer landing: the player's animal pops up from the pulse bar */
  .fxp{position:absolute; bottom:16vh; font-size:clamp(24px,2.6vw,40px); opacity:0;
    animation:fxpop 1.8s ease-out forwards; will-change:transform,opacity;}
  @keyframes fxpop{0%{transform:translateY(0) scale(.6); opacity:0}15%{opacity:1; transform:translateY(-4vh) scale(1.15)}
    100%{transform:translateY(-38vh) scale(1); opacity:0}}

  /* the reveal breathes: each block enters on its own beat */
  #reveal.show .roundtag{animation:reveal .5s cubic-bezier(.22,1,.36,1) both;}
  #reveal.show .vhero{animation:cdpop .7s cubic-bezier(.2,1.3,.4,1) .3s both;}
  #reveal.show #vSpots{animation:reveal .7s cubic-bezier(.22,1,.36,1) 1.05s both;}
  #reveal.show .subtext{animation:reveal .6s cubic-bezier(.22,1,.36,1) 1.45s both;}
  #reveal.show #vStandings{animation:reveal .7s cubic-bezier(.22,1,.36,1) 1.85s both;}

  /* ===== ENDED ===== */
  .champlabel{font-size:clamp(22px,2.8vw,42px); font-weight:700; letter-spacing:.12em; color:var(--g-blue-700); text-transform:uppercase;}
  .champ{display:flex; align-items:center; gap:2vw; max-width:92vw; background:var(--surface-glass); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    border:1px solid rgba(66,133,244,.3); box-shadow:var(--e3), var(--glow-strong); border-radius:var(--r-xl); padding:3vh 4vw; animation:cdpop .8s cubic-bezier(.2,1.3,.4,1);}
  .champ .em{font-size:min(24vh,20vw); flex:none;}
  .champ .info{text-align:left; min-width:0;}
  .champ .nm{font-family:var(--font-display); font-size:clamp(32px,4.6vw,84px); font-weight:700; line-height:1.06; color:var(--ink); text-wrap:balance; overflow-wrap:break-word;}
  .champ .nm .seq{font-family:var(--font-mono); color:var(--ink-2);}
  .champ .ct{font-family:var(--font-mono); font-size:clamp(26px,3.2vw,52px); font-weight:500; color:var(--g-green-700);}
  .podium{display:flex; gap:1.5vw; margin-top:1vh; flex-wrap:wrap; justify-content:center;}
  .pod{background:var(--surface); border:1px solid var(--line); box-shadow:var(--e1); border-radius:var(--r-md); padding:14px 24px; font-weight:500; font-size:clamp(17px,2vw,32px); color:var(--ink);}
  .pod b{font-family:var(--font-mono); color:var(--g-blue-700);}
  .again{color:var(--ink-2); font-size:clamp(16px,1.7vw,26px); margin-top:1vh;}

  .hidden{display:none !important;}
</style>
</head>
<body class="noise-bg">
  <canvas id="confetti"></canvas>
  <div id="fx"></div>
  <div class="brand"><span class="ico">🧠</span> <span class="shimmer">Sequência</span></div>
  <div class="chips" id="chips">
    <div class="chip"><div class="k">Jogadores</div><div class="v" id="cPlayers">0</div></div>
    <div class="chip timer" id="cTimerChip"><div class="k">Rodada</div><div class="v" id="cRound">—</div></div>
  </div>

  <!-- LOBBY -->
  <div class="stage show" id="lobby">
    <div class="big"><span>🧠</span> <span class="shimmer">Sequência</span></div>
    <div class="sub">Escaneie, decore a sequência, repita na ordem certa.</div>
    <div class="qr" id="qr"></div>
    <div class="ready"><span id="lobbyReady"></span></div>
  </div>

  <!-- COUNTDOWN -->
  <div class="stage" id="countdown">
    <div id="cdnum" class="cdpop n3">3</div>
  </div>

  <!-- MEMORIZE -->
  <div class="stage" id="memorize">
    <div class="bigcue" id="mCue">👀 DECORE A SEQUÊNCIA!</div>
    <div class="roundtag hidden" id="mTag">Rodada <span id="mRound">1</span> — decore!</div>
    <div class="tiles" id="mTiles"></div>
    <div class="mdots" id="mDots"></div>
  </div>

  <!-- RECALL -->
  <div class="stage" id="recall">
    <div class="roundtag">Reproduzam de memória!</div>
    <div class="tiles" id="rTiles"></div>
    <div class="subtext" id="rDetail"></div>
    <div class="pulsewrap"><div class="pulsebar" id="rPulse"></div></div>
  </div>

  <!-- REVEAL -->
  <div class="stage" id="reveal">
    <div class="roundtag" id="vTitle">Apurando…</div>
    <div class="vhero" id="vHero"></div>
    <div class="podium" id="vSpots"></div>
    <div class="subtext" id="vDetail"></div>
    <div class="podium" id="vStandings"></div>
  </div>

  <!-- BONUS (arm + hit share the stage; the lit tile is the whole reveal) -->
  <div class="stage" id="bonus">
    <div class="bigcue" id="bCue">⚡ REFLEXO!</div>
    <div class="cuedetail" id="bDetail"></div>
    <div class="tiles" id="bTiles"></div>
  </div>

  <!-- ENDED -->
  <div class="stage" id="ended">
    <div class="champlabel" id="champlabel">🏆 Campeão 🏆</div>
    <div class="champ" id="champ"></div>
    <div class="podium" id="podium"></div>
    <div class="again">Aguardando o host… (uma nova rodada pode começar a qualquer momento)</div>
  </div>

<script>
(() => {
  'use strict';
  const $ = (id)=>document.getElementById(id);
  const PHASE = { LOBBY:'lobby', COUNTDOWN:'countdown', MEMORIZE:'memorize', RECALL:'recall', REVEAL:'reveal',
                  BONUS_ARM:'bonus_arm', BONUS_HIT:'bonus_hit', ENDED:'ended' };
  const stages = { lobby:$('lobby'), countdown:$('countdown'), memorize:$('memorize'), recall:$('recall'),
                   reveal:$('reveal'), bonus:$('bonus'), ended:$('ended') };
  const stageFor = (phase)=> phase.startsWith('bonus') ? 'bonus' : phase;
  function showStage(name){ for (const k in stages) stages[k].classList.toggle('show', k===name); }

  // Same four, same order as src/batucada.js's SYMBOLS — classic Simon Says,
  // plain colors, nothing to read or decode beyond the color itself.
  const TILE_COLORS = ['#4285F4', '#EA4335', '#FBBC04', '#34A853'];

  function buildTiles(container){
    container.innerHTML = '';
    TILE_COLORS.forEach((color) => {
      const d = document.createElement('div');
      d.className = 'tile';
      d.style.background = color;
      d.style.color = color; // currentColor, used by the lit glow
      container.appendChild(d);
    });
    return [...container.children];
  }
  const mTiles = buildTiles($('mTiles'));
  const rTiles = buildTiles($('rTiles'));
  const bTiles = buildTiles($('bTiles'));

  let clockOffset=0, bestRtt=Infinity;
  const estServerNow=()=>Date.now()+clockOffset;
  let cur=PHASE.LOBBY, lastCd=null, state={phase:PHASE.LOBBY,total:0,round:0,totalRounds:10,sequence:[]};
  let endedShownRound=-1, lastLitIndex=-1, memorizeRoundBuilt=-1;

  // Single client, so the extra request to compensate the one-way SSE offset
  // is free (see Tap Race's screen.html) — and the flash animation genuinely
  // needs the precision this buys, unlike the phone's cosmetic bar.
  async function sampleClock(){
    const t0=Date.now();
    try{
      const r=await fetch('/batucada/state');
      const s=await r.json();
      const t1=Date.now(), rtt=t1-t0;
      if (typeof s.serverNow!=='number' || rtt<0 || rtt>5000) return;
      if (Math.abs((s.serverNow-t1)-clockOffset)>5000) bestRtt=Infinity;
      if (rtt>bestRtt) return;
      bestRtt=rtt; clockOffset=s.serverNow+rtt/2-t1;
    }catch(_){}
  }

  const origin=location.origin;
  fetch('/qr.svg?data='+encodeURIComponent(origin+'/batucada')).then(r=>r.text()).then(svg=>{$('qr').innerHTML=svg;}).catch(()=>{});

  function connect(){
    const es=new EventSource('/batucada/events');
    es.onmessage=(e)=>{ try{ onState(JSON.parse(e.data)); }catch(_){} };
    es.onerror=()=>{ es.close(); setTimeout(connect,1500); };
  }

  function onState(s){
    if (bestRtt===Infinity && typeof s.serverNow==='number') clockOffset=s.serverNow-Date.now();
    if (Array.isArray(s.reactions)) floatReactions(s.reactions);
    if (Array.isArray(s.pops)) floatPops(s.pops);
    const changed = s.phase!==cur;
    state=s; cur=s.phase;
    $('cPlayers').textContent = fmt(s.total);
    $('cRound').textContent = s.phase.startsWith('bonus') ? '⚡' : (s.round ? (s.round+'/'+s.totalRounds) : '—');
    if (changed) enterPhase(s.phase, s);
    if (s.phase===PHASE.LOBBY) renderReady(s.total);
    if (s.phase===PHASE.MEMORIZE) renderMemorize(s);
    if (s.phase===PHASE.RECALL) renderRecall(s);
    if (s.phase===PHASE.REVEAL) renderReveal(s);
    if (s.phase===PHASE.BONUS_ARM || s.phase===PHASE.BONUS_HIT) renderBonus(s);
    if (s.phase===PHASE.ENDED) renderEnded(s);
  }

  function enterPhase(phase, s){
    stopConfetti();
    showStage(stageFor(phase));
    if (phase===PHASE.MEMORIZE){ memorizeRoundBuilt=-1; lastLitIndex=-1; }
    if (phase===PHASE.ENDED) renderEnded(s);
  }

  // ---- bonus: suspense, then ONE color — the tile lights the instant the
  // phase flips to bonus_hit (the server withholds the color until then) ----
  function renderBonus(s){
    const cue = $('bCue');
    if (s.phase===PHASE.BONUS_ARM){
      bTiles.forEach(t=>t.classList.remove('lit'));
      cue.classList.remove('go');
      cue.textContent = '⚡ REFLEXO!';
      $('bDetail').textContent = 'Quando uma cor acender, TOQUE NELA no celular — tocar antes queima a vez!';
    } else {
      bTiles.forEach((t,i)=>t.classList.toggle('lit', i===s.bonusColor));
      cue.classList.add('go');
      cue.textContent = 'AGORA!';
      $('bDetail').textContent = '';
    }
  }

  const NUM=new Intl.NumberFormat('pt-BR');
  function fmt(n){ return NUM.format(Number(n)||0); }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function renderReady(total){
    const n=total||0;
    $('lobbyReady').innerHTML='<b>'+escapeHtml(fmt(n))+'</b> '+(n===1?'jogador pronto':'jogadores prontos');
  }

  // ---- countdown ----
  function tickCountdown(){
    if (cur===PHASE.COUNTDOWN && state.startsAt){
      const ms=state.startsAt-estServerNow();
      const num=Math.ceil(ms/1000);
      const txt= num>0? String(num):'VAI!';
      if (txt!==lastCd){
        lastCd=txt; const el=$('cdnum');
        el.textContent=txt;
        el.className='cdnum '+(num>0?('n'+Math.min(num,3)):'go');
        void el.offsetWidth; el.classList.add('cdpop');
      }
    }
    requestAnimationFrame(tickCountdown);
  }

  // ---- memorize: flash the sequence in real time off the synced clock ----
  let cueShowing = null; // the big blinking DECORE owns the lead-in, then swaps out
  function renderMemorize(s){
    $('mRound').textContent = s.round;
    if (memorizeRoundBuilt !== s.round){
      memorizeRoundBuilt = s.round;
      mTiles.forEach(t=>t.classList.remove('lit'));
      lastLitIndex = -1;
      cueShowing = null;
      $('mCue').textContent = '👀 Rodada '+s.round+' — DECORE!';
      const dots=$('mDots'); dots.innerHTML='';
      for (let i=0;i<s.round;i++){ const d=document.createElement('div'); d.className='md'; dots.appendChild(d); }
    }
  }
  function tickMemorize(){
    if (cur===PHASE.MEMORIZE && state.memorizeStartsAt!=null && Array.isArray(state.sequence)){
      const onMs = state.symbolOnMs||1200, gapMs = state.symbolGapMs||700, step = onMs+gapMs;
      // The lead-in is the breath between "stage appeared" and the first
      // flash — the big blinking cue owns it, then hands off to the tiles.
      const elapsed = estServerNow() - state.memorizeStartsAt - (state.memorizeLeadInMs||0);
      const cueing = elapsed < 0;
      if (cueing !== cueShowing){
        cueShowing = cueing;
        $('mCue').classList.toggle('hidden', !cueing);
        $('mTag').classList.toggle('hidden', cueing);
      }
      const idx = Math.floor(elapsed/step);
      const within = elapsed - idx*step;
      const lit = elapsed>=0 && idx>=0 && idx<state.sequence.length && within < onMs ? idx : -1;
      if (lit !== lastLitIndex){
        mTiles.forEach(t=>t.classList.remove('lit'));
        if (lit>=0) mTiles[state.sequence[lit]].classList.add('lit');
        lastLitIndex = lit;
      }
      // progress dots: fill every symbol whose flash has started
      const dots=$('mDots').children;
      for (let i=0;i<dots.length;i++) dots[i].classList.toggle('done', elapsed >= i*step);
    }
    requestAnimationFrame(tickMemorize);
  }

  // ---- crowd reactions: same emoji order as the phone's torcida bar ----
  const REACT_EMOJI = ['🔥','👏','😱','❤️'];
  const FX_MAX_PER_FRAME = 24; // one SSE frame's worth — a huge room stays a shower, not a wall
  function floatReactions(counts){
    const layer = $('fx');
    let budget = FX_MAX_PER_FRAME;
    counts.forEach((n, i) => {
      for (let k = 0; k < n && budget > 0; k++, budget--){
        const el = document.createElement('span');
        el.className = 'fx';
        el.textContent = REACT_EMOJI[i] || '❤️';
        el.style.left = (32 + Math.random()*36) + 'vw'; // center band — where every eye already is
        el.style.animationDelay = (Math.random()*0.4).toFixed(2) + 's';
        el.style.setProperty('--fxr', (Math.random()*40 - 20).toFixed(0) + 'deg');
        el.addEventListener('animationend', () => el.remove());
        layer.appendChild(el);
      }
    });
  }

  // an answer landing: the player's animal emoji hops up near the pulse bar
  function floatPops(emojis){
    const layer = $('fx');
    emojis.slice(0, 12).forEach((em) => {
      const el = document.createElement('span');
      el.className = 'fxp';
      el.textContent = em;
      el.style.left = (36 + Math.random()*28) + 'vw';
      el.style.animationDelay = (Math.random()*0.3).toFixed(2) + 's';
      el.addEventListener('animationend', () => el.remove());
      layer.appendChild(el);
    });
  }

  // ---- recall: dimmed tiles + the live answer pulse ----
  function renderRecall(s){
    rTiles.forEach(t=>t.classList.remove('lit'));
    $('rDetail').innerHTML = '<b>'+fmt(s.submittedCount||0)+'</b> de '+fmt(s.total)+' já responderam';
    $('rPulse').style.width = (s.total>0 ? Math.min(100,(s.submittedCount||0)/s.total*100) : 0).toFixed(1)+'%';
  }

  // ---- reveal: the round's hero, the bragging rights, the standings ----
  // Rebuilt once per reveal (SSE repeats the frame 10x/s) — the guard is what
  // keeps the confetti a burst instead of a hose.
  let revealShownKey = null;
  function renderReveal(s){
    const key = s.roundId + '/' + s.round + '/' + (s.bonusReveal ? 'b' : 'm');
    if (revealShownKey === key) return;
    revealShownKey = key;

    const sp = s.spotlight || {};
    const hero = $('vHero');
    const secs = sp.fastest ? (sp.fastest.ms/1000).toFixed(1).replace('.', ',') + 's' : '';

    if (s.bonusReveal){
      $('vTitle').textContent = '⚡ Rodada Bônus';
      $('vDetail').textContent = fmt(s.roundClearedCount) + ' de ' + fmt(s.total) +
        (s.roundClearedCount===1 ? ' acertou' : ' acertaram') + ' no reflexo — de volta à memória!';
    } else {
      $('vTitle').textContent = 'Rodada ' + s.round + ' de ' + s.totalRounds;
      $('vDetail').textContent = s.roundClearedCount===0
        ? 'ninguém acertou a sequência inteira dessa vez'
        : fmt(s.roundClearedCount) + ' de ' + fmt(s.total) +
          (s.roundClearedCount===1 ? ' acertou' : ' acertaram') + ' a sequência inteira';
    }

    // The hero card: the fastest correct answer owns the round.
    if (sp.fastest){
      hero.className = 'vhero';
      hero.innerHTML = `<div class="em">${sp.fastest.emoji||'🏅'}</div><div class="info">`+
        `<div class="nm">${escapeHtml(sp.fastest.name)} <span class="seq">#${sp.fastest.seq}</span></div>`+
        `<div class="deed">⚡ ${s.bonusReveal?'reflexo':'resposta'} mais rápida — ${secs}</div></div>`;
    } else {
      hero.className = 'vhero none';
      hero.innerHTML = `<div class="em">😅</div><div class="info">`+
        `<div class="nm">${s.bonusReveal?'Ninguém acertou o reflexo':'Essa pegou todo mundo!'}</div></div>`;
    }

    // secondary bragging rights
    const spots=$('vSpots'); spots.innerHTML='';
    if (sp.bestStreak){
      const d=document.createElement('div'); d.className='pod';
      d.innerHTML=`🔥 Sequência perfeita: ${sp.bestStreak.emoji||''} ${escapeHtml(sp.bestStreak.name)} <span class="seq">#${sp.bestStreak.seq}</span> — ${sp.bestStreak.n} rodadas`;
      spots.appendChild(d);
    }
    if (sp.climber){
      const d=document.createElement('div'); d.className='pod';
      d.innerHTML=`📈 Subiu ${sp.climber.up} ${sp.climber.up===1?'posição':'posições'}: ${sp.climber.emoji||''} ${escapeHtml(sp.climber.name)} <span class="seq">#${sp.climber.seq}</span>`;
      spots.appendChild(d);
    }

    const st=$('vStandings'); st.innerHTML='';
    (s.top||[]).slice(0,5).forEach(p=>{
      const d=document.createElement('div'); d.className='pod';
      d.innerHTML=`<b>#${p.rank}</b> ${p.emoji||''} ${escapeHtml(p.name)} <span class="seq">#${p.seq}</span> — ✓${fmt(p.cleared)} · ${fmt(p.symbols)} pts`;
      st.appendChild(d);
    });

    // the fun beat: every round somebody cleared gets its own little rain
    if ((s.roundClearedCount||0) > 0) launchConfetti(120);
  }

  // ---- ended ----
  function renderEnded(s){
    showStage('ended');
    if (endedShownRound===s.roundId) return;
    endedShownRound=s.roundId;
    const w=s.winner; const top=s.top||[];
    const champ=$('champ');
    if (w){
      const winnerStats = top.find(p=>p.id===w.id);
      const cleared = winnerStats ? winnerStats.cleared : 0;
      champ.innerHTML=`<div class="em">${w.emoji}</div><div class="info"><div class="nm">${escapeHtml(w.name)} <span class="seq">#${w.seq}</span></div><div class="ct">✓ ${fmt(cleared)} ${cleared===1?'rodada':'rodadas'}${winnerStats?` · ${fmt(winnerStats.symbols)} pts`:''}</div></div>`;
    } else {
      champ.innerHTML=`<div class="info"><div class="nm">Ninguém jogou 😴</div></div>`;
    }
    const pod=$('podium'); pod.innerHTML='';
    top.slice(0,5).forEach(p=>{
      const d=document.createElement('div'); d.className='pod';
      d.innerHTML=`<b>#${p.rank}</b> ${p.emoji||''} ${escapeHtml(p.name)} <span class="seq">#${p.seq}</span> — ✓${fmt(p.cleared)} · ${fmt(p.symbols)} pts`;
      pod.appendChild(d);
    });
    launchConfetti();
  }

  // ---- confetti (self-contained, no CDN — same as Tap Race's screen.html) ----
  const cvs=$('confetti'), ctx=cvs.getContext('2d');
  let parts=[], confettiOn=false, confettiActive=false;
  function resize(){ cvs.width=innerWidth; cvs.height=innerHeight; }
  resize(); addEventListener('resize',resize);
  const COLORS=['#4285F4','#EA4335','#FBBC04','#34A853','#A142F4','#00BCD4'];
  function launchConfetti(n){
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    parts=[];
    const N=n||280; // full rain at the end; a lighter burst per cleared round
    for (let i=0;i<N;i++){
      parts.push({
        x:Math.random()*cvs.width, y:Math.random()*cvs.height*0.4-60,
        vx:(Math.random()-0.5)*10, vy:-5+Math.random()*6,
        s:7+Math.random()*11, rot:Math.random()*6.28, vr:(Math.random()-0.5)*0.35,
        c:COLORS[i%COLORS.length],
      });
    }
    confettiActive=true;
    if (!confettiOn){ confettiOn=true; requestAnimationFrame(raf); }
  }
  function stopConfetti(){ confettiActive=false; }
  function raf(){
    ctx.clearRect(0,0,cvs.width,cvs.height);
    let alive=0;
    for (const p of parts){
      p.vy+=0.13; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      if (p.y<cvs.height+40){
        alive++;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c;
        ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); ctx.restore();
      }
    }
    if (alive>0 && confettiActive){ requestAnimationFrame(raf); }
    else { ctx.clearRect(0,0,cvs.width,cvs.height); confettiOn=false; }
  }

  // boot
  renderReady(0);
  connect();
  for (let i=0;i<4;i++) setTimeout(sampleClock, i*200);
  setInterval(sampleClock, 15000);
  requestAnimationFrame(tickCountdown);
  requestAnimationFrame(tickMemorize);
})();
</script>
</body>
</html>
