<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Sequência</title>
<!-- Roboto is self-hosted in theme.css; no external font request. -->
<link rel="stylesheet" href="/theme.css" />
<style>
  html,body{height:100%;}
  body{
    overflow:hidden; overscroll-behavior:none; touch-action:manipulation;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
    display:flex; flex-direction:column;
    --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
    background:radial-gradient(130% 70% at 50% -20%, rgba(161,66,244,.16), transparent 60%), var(--bg);
  }
  .appbar{display:flex; align-items:center; gap:8px; padding:calc(12px + var(--safe-top)) 18px 4px;}
  .appbar .ico{font-size:18px; line-height:1;}
  .appbar .title{font-family:var(--font-display); font-weight:700; font-size:18px; color:var(--ink); margin-right:auto; letter-spacing:-.01em;}
  .wrap{flex:1; display:flex; flex-direction:column; padding:8px 16px calc(16px + var(--safe-bot)); gap:12px; min-height:0;}

  .id-card{background:var(--surface-glass); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid var(--line);
    border-radius:var(--r-lg); box-shadow:var(--e1); text-align:center; padding:14px;}
  .id-card .who{font-size:11px; letter-spacing:.14em; color:var(--ink-2); text-transform:uppercase; font-weight:500;}
  .id-card .name{font-family:var(--font-display); font-size:clamp(19px,5.6vw,26px); font-weight:700; line-height:1.15; margin-top:4px; color:var(--ink);
    text-wrap:balance; overflow-wrap:break-word;}
  .id-card .seq{font-family:var(--font-mono); color:var(--g-blue-700); font-weight:500;}

  .stage{flex:1; display:flex; flex-direction:column; gap:14px; min-height:0;}

  .center{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:10px;}
  .center .big{font-size:clamp(48px,16vw,84px); line-height:1;}
  .center .msg{font-family:var(--font-display); font-size:clamp(18px,5vw,24px); font-weight:700; color:var(--ink);}
  @keyframes cuepulse{0%,100%{opacity:.5; transform:scale(.97)}50%{opacity:1; transform:scale(1.03)}}
  .center .sub{color:var(--ink-2); font-size:15px; font-weight:500;}
  .pulse-ico{animation:pulseIco 1.6s ease-in-out infinite;}
  @keyframes pulseIco{0%,100%{transform:scale(1); opacity:.85} 50%{transform:scale(1.12); opacity:1}}

  .round-tag{font-family:var(--font-mono); color:var(--g-blue-700); font-weight:500; font-size:14px; letter-spacing:.04em;}

  .timewrap{height:8px; border-radius:var(--r-full); background:var(--surface-2); overflow:hidden; border:1px solid var(--line);}
  .timebar{height:100%; width:100%; border-radius:var(--r-full); background:linear-gradient(90deg,#A142F4,#4285F4);}

  .dots{display:flex; gap:8px; justify-content:center; flex-wrap:wrap;}
  .dot{width:14px; height:14px; border-radius:50%; background:var(--surface-2); border:1px solid var(--line);}
  .dot.fill{background:var(--g-blue); box-shadow:0 0 10px rgba(66,133,244,.6);}

  .grid{flex:1; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:14px; min-height:0;}
  .inst{border:none; border-radius:var(--r-lg); cursor:pointer; -webkit-tap-highlight-color:transparent;
    transition:transform .06s ease, filter .12s ease; box-shadow:0 8px 20px rgba(0,0,0,.4);}
  .inst:active{transform:scale(.94);}
  .inst.flash{filter:brightness(1.6);}
  .inst.disabled{opacity:.3; pointer-events:none;}

  .status{text-align:center; min-height:22px; font-weight:500; color:var(--ink-2); font-size:14px;}
  .status.warn{color:var(--g-yellow-700); font-weight:700; font-size:16px; animation:cuepulse 1.1s ease-in-out infinite;}

  /* torcida — crowd reactions that float up the big screen. This is the
     player's only voice between answers, so it earns real visual weight:
     big glowing targets that announce themselves when they appear. */
  .torcida{display:none; gap:10px; justify-content:center;}
  .torcida.show{display:flex; animation:torcidain .4s cubic-bezier(.22,1,.36,1);}
  @keyframes torcidain{from{opacity:0; transform:translateY(16px) scale(.92)}to{opacity:1}}
  .torcida button{flex:1; max-width:96px; font-size:34px; line-height:1; padding:16px 0;
    background:var(--surface-glass); border:1px solid rgba(66,133,244,.4);
    border-radius:var(--r-lg); box-shadow:var(--e1), 0 0 18px rgba(66,133,244,.22);
    cursor:pointer; -webkit-tap-highlight-color:transparent; transition:transform .08s ease;
    animation:glowPulse 2.6s ease-in-out infinite;}
  .torcida button:active{transform:scale(1.3);}

  .overlay{position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column;
    background:rgba(0,0,0,.92); backdrop-filter:blur(8px); z-index:50;}
  .overlay.show{display:flex;}
  .cd{font-family:var(--font-mono); font-size:clamp(140px,46vw,260px); font-weight:500; line-height:1; color:var(--g-blue); animation:cdpop .9s ease-out;}
  .cd.n3{color:var(--g-blue);} .cd.n2{color:var(--g-red);} .cd.n1{color:var(--g-yellow);} .cd.go{color:var(--g-green);}
  @keyframes cdpop{0%{transform:scale(.3);opacity:0}40%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
  .cd-sub{color:var(--ink-2); font-weight:500; letter-spacing:.14em; text-transform:uppercase; margin-top:10px;}

  .hidden{display:none !important;}
</style>
</head>
<body class="noise-bg">
  <div class="appbar">
    <span class="ico">🧠</span>
    <span class="title shimmer">Sequência</span>
  </div>
  <div class="wrap">
    <div class="id-card">
      <div class="who">Você é</div>
      <div class="name"><span class="emoji" id="emoji">🎮</span> <span id="name">Conectando…</span> <span class="seq" id="seq"></span></div>
    </div>
    <div class="stage" id="stage"></div>
    <div class="status" id="status"></div>
    <div class="torcida" id="torcida">
      <button type="button" data-r="0">🔥</button>
      <button type="button" data-r="1">👏</button>
      <button type="button" data-r="2">😱</button>
      <button type="button" data-r="3">❤️</button>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="cd n3" id="cd">3</div>
    <div class="cd-sub">Prepare a memória…</div>
  </div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const els = { emoji:$('emoji'), name:$('name'), seq:$('seq'), stage:$('stage'), status:$('status'),
                overlay:$('overlay'), cd:$('cd'), torcida:$('torcida') };

  const PHASE = { LOBBY:'lobby', COUNTDOWN:'countdown', MEMORIZE:'memorize', RECALL:'recall', REVEAL:'reveal',
                  BONUS_ARM:'bonus_arm', BONUS_HIT:'bonus_hit', ENDED:'ended' };

  // Same four, same order as src/batucada.js's SYMBOLS — the wire format is
  // an index into this array, so the order must match exactly. Plain colors,
  // classic Simon Says — no icon or label to read, just remember and repeat.
  const COLORS = ['#4285F4', '#EA4335', '#FBBC04', '#34A853'];

  let me = { id: localStorage.getItem('batucadaId') || null };
  // NTP-style, RTT-compensated — same algorithm as index.html. A naive
  // `serverNow - Date.now()` is wrong by roughly this phone's one-way
  // latency, and that error is *different per phone* (whoever has worse
  // wifi sees the countdown and the recall bar visibly lag behind everyone
  // else's). Grading itself still happens server-side off the /recall POST's
  // own arrival time — this is purely so the shared countdown moment and the
  // recall bar actually look shared across every phone in the room.
  let clockOffset = 0;
  let bestRtt = Infinity;
  const estServerNow = () => Date.now() + clockOffset;

  function syncClock(serverNow, t0, t1){
    if (typeof serverNow !== 'number') return;
    const rtt = t1 - t0;
    if (rtt < 0 || rtt > 5000) return; // nonsense sample (suspended tab, dead link)
    // If the device clock itself jumped (NTP correction, user edit), every past
    // sample is void — start the search over rather than trusting a stale min.
    if (Math.abs((serverNow - t1) - clockOffset) > 5000) bestRtt = Infinity;
    if (rtt > bestRtt) return;
    bestRtt = rtt;
    clockOffset = serverNow + rtt / 2 - t1;
  }

  let state = { phase: PHASE.LOBBY, known:false, total:0, round:0, totalRounds:10 };
  let myRoundId = null; // a whole new game (start() bumps it)
  let myRound = -1; // the round within the game — input state resets per round
  let myBonusKey = null; // the bonus round's own input reset (round number doesn't change)
  let mySeq = [];
  let submitted = false;
  let gridBuiltForRound = -1;
  let lastCdShown = null;

  async function apiJson(url, opts){
    const t0 = Date.now();
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 8000);
    try{
      const r = await fetch(url, Object.assign({ signal: ctl.signal }, opts));
      const s = await r.json();
      syncClock(s && s.serverNow, t0, Date.now());
      return s;
    } finally { clearTimeout(timer); }
  }

  function setIdentity(s){
    if (s.id){ me.id = s.id; localStorage.setItem('batucadaId', s.id); }
    els.emoji.textContent = s.emoji || '🎮';
    els.name.textContent = s.name || '—';
    els.seq.textContent = s.seq ? ('#' + s.seq) : '';
  }

  function applyState(s){
    if (!s) return;
    if (s.known === false && me.id) { reregister(); return; }
    if (typeof s.roundId === 'number' && s.roundId !== myRoundId){
      myRoundId = s.roundId; myRound = -1;
    }
    // Input state is per ROUND, not per game: without this, `submitted` from
    // round 1 leaks into round 2 and the grid never comes back. (Latent in
    // the elimination version — no test room ever survived to round 2.)
    if (typeof s.round === 'number' && s.round !== myRound){
      myRound = s.round; mySeq = []; submitted = false; gridBuiltForRound = -1;
    }
    // The bonus keeps the same round number, so it needs its own reset when
    // the suspense phase arrives (once per game — keyed on roundId).
    if (s.phase === PHASE.BONUS_ARM && myBonusKey !== s.roundId){
      myBonusKey = s.roundId; mySeq = []; submitted = false; gridBuiltForRound = -1;
    }
    state = s;
    if (s.name) setIdentity(s);
    render();
  }

  let reregistering = false;
  async function reregister(){
    if (reregistering) return; reregistering = true;
    try{
      const s = await apiJson(joinUrl(), { method:'POST' });
      mySeq = []; submitted = false; gridBuiltForRound = -1; myRoundId = null; myRound = -1;
      setIdentity(s);
    }catch(_){ /* retry on next poll */ }
    finally{ reregistering = false; }
  }

  function joinUrl(){
    let l = null;
    try{ l = new URLSearchParams(location.search).get('lang'); }catch(_){}
    return l ? '/batucada/join?lang=' + encodeURIComponent(l) : '/batucada/join';
  }

  async function join(){
    try{
      if (me.id){
        const s = await apiJson('/batucada/state?id=' + encodeURIComponent(me.id));
        if (s.known){ setIdentity(s); applyState(s); return; }
      }
      const s = await apiJson(joinUrl(), { method:'POST' });
      setIdentity(s);
    }catch(e){ els.status.textContent = 'Sem conexão… tentando de novo'; }
  }

  let pollInFlight = false;
  async function pollState(){
    if (pollInFlight) return;
    pollInFlight = true;
    try{ applyState(await apiJson('/batucada/state?id=' + encodeURIComponent(me.id || ''))); }
    catch(e){}
    finally{ pollInFlight = false; }
  }

  async function submitRecall(){
    submitted = true;
    render();
    try{
      const s = await apiJson('/batucada/recall', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ id: me.id, sequence: mySeq }),
      });
      applyState(s); // the view carries lastPrefix/lastCleared — no client-side bookkeeping
    }catch(e){ /* the next poll will still grade us via the timeout path if this never lands */ }
  }

  function vibe(ms){
    try{
      if (!navigator.vibrate) return;
      const ua = navigator.userActivation;
      if (ua && !ua.hasBeenActive) return;
      navigator.vibrate(ms);
    }catch(_){}
  }

  // ---- torcida: fire-and-forget crowd reactions (server throttles too) ----
  let lastReact = 0;
  els.torcida.addEventListener('pointerdown', (e) => {
    const b = e.target.closest('button[data-r]');
    if (!b) return;
    e.preventDefault();
    const now = Date.now();
    if (now - lastReact < 260) return;
    lastReact = now;
    vibe(10);
    fetch('/batucada/react', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ id: me.id, r: Number(b.dataset.r) }),
    }).catch(()=>{});
  }, { passive:false });

  // ---- rendering ------------------------------------------------------------

  function showCountdown(show){
    els.overlay.classList.toggle('show', show);
    if (!show){ lastCdShown = null; return; }
    const ms = (state.startsAt||0) - estServerNow();
    const num = Math.ceil(ms/1000);
    const shown = num > 0 ? String(num) : 'GO!';
    if (shown !== lastCdShown){
      lastCdShown = shown;
      els.cd.textContent = shown;
      els.cd.className = 'cd ' + (num>=3?'n3':num===2?'n2':num===1?'n1':'go');
      vibe(num>0?20:60);
    }
  }

  function centerHtml(icon, msg, sub){
    return '<div class="center"><div class="big">'+icon+'</div><div class="msg">'+msg+'</div>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</div>';
  }

  // `bonus` mode: expect a single tap, no dots, no time bar — the only thing
  // on screen is the four colors and the player's nerve.
  function buildRecallGrid(bonus){
    const expect = bonus ? 1 : state.round;
    gridBuiltForRound = bonus ? 'bonus' : state.round;
    mySeq = []; submitted = false;
    const grid = document.createElement('div');
    grid.className = 'grid';
    COLORS.forEach((color, idx) => {
      const b = document.createElement('button');
      b.className = 'inst';
      b.style.background = color;
      b.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (submitted || mySeq.length >= expect) return;
        mySeq.push(idx);
        b.classList.add('flash'); setTimeout(()=>b.classList.remove('flash'), 150);
        vibe(15);
        updateDots();
        if (mySeq.length >= expect) submitRecall();
      }, { passive:false });
      grid.appendChild(b);
    });
    els.stage.innerHTML = '';
    if (!bonus){
      const dots = document.createElement('div');
      dots.className = 'dots';
      dots.id = 'dots';
      for (let i=0;i<expect;i++){ const d=document.createElement('div'); d.className='dot'; dots.appendChild(d); }
      els.stage.appendChild(dots);
    }
    els.stage.appendChild(grid);
    if (!bonus){
      const bar = document.createElement('div');
      bar.className = 'timewrap';
      bar.innerHTML = '<div class="timebar" id="recallbar"></div>';
      els.stage.appendChild(bar);
    }
  }

  function updateDots(){
    const dots = document.getElementById('dots');
    if (!dots) return;
    [...dots.children].forEach((d,i) => d.classList.toggle('fill', i < mySeq.length));
  }

  const roundLabel = () => 'Rodada ' + state.round + ' de ' + (state.totalRounds || 10);
  const scoreLabel = () => '✓ ' + (state.cleared||0) + (state.cleared===1?' rodada':' rodadas') + ' · ' + (state.symbols||0) + (state.symbols===1?' ponto':' pontos');

  function render(){
    if (!state.known){
      els.stage.innerHTML = centerHtml('🧠', 'Conectando…');
      els.status.textContent = '';
      els.torcida.classList.remove('show');
      showCountdown(false);
      return;
    }

    showCountdown(state.phase === PHASE.COUNTDOWN);
    els.status.className = 'status'; // the bonus branch re-adds .warn; nothing else may inherit it

    // The torcida is open whenever tapping it can't hurt anyone's focus:
    // never during the flash or the bonus, and never while you should be
    // answering — only after your own answer is in.
    const cheering = state.phase === PHASE.LOBBY || state.phase === PHASE.REVEAL
      || state.phase === PHASE.ENDED
      || (state.phase === PHASE.RECALL && (submitted || state.submitted));
    els.torcida.classList.toggle('show', cheering);

    if (state.phase === PHASE.ENDED){
      const champ = state.yourRank === 1;
      els.stage.innerHTML = centerHtml(
        champ ? '🏆' : '🧠',
        champ ? 'Você é o campeão!' : ('Você ficou em #' + (state.yourRank ?? '?')),
        scoreLabel(),
      );
      els.status.textContent = '';
      return;
    }

    if (state.phase === PHASE.LOBBY){
      els.stage.innerHTML = centerHtml('🧠', 'Aguardando o host iniciar…');
      els.status.textContent = 'Manda uma reação pro telão 👇';
    } else if (state.phase === PHASE.COUNTDOWN){
      els.stage.innerHTML = centerHtml('🧠', 'Prepare-se!');
      els.status.textContent = '';
    } else if (state.phase === PHASE.MEMORIZE){
      // Deliberately quiet: the big blinking DECORE lives on the projector.
      // The phone's only job here is to point the eyes away from itself.
      els.stage.innerHTML = centerHtml('<span class="pulse-ico">👀</span>', 'Olhe para a tela', roundLabel());
      els.status.textContent = state.round > 1 ? scoreLabel() : '';
    } else if (state.phase === PHASE.RECALL){
      // `submitted` is the instant local flag; state.submitted covers a phone
      // that reloaded mid-round after the server already took its answer.
      if (submitted || state.submitted){
        els.stage.innerHTML = centerHtml('✅', 'Enviado!', 'Torça pela sala enquanto os outros terminam');
        els.status.textContent = 'Manda uma reação pro telão 👇';
      } else {
        if (gridBuiltForRound !== state.round) buildRecallGrid(false);
        els.status.textContent = 'Toque na ordem que apareceu na tela — ' + roundLabel().toLowerCase();
      }
    } else if (state.phase === PHASE.BONUS_ARM || state.phase === PHASE.BONUS_HIT){
      if (submitted || state.submitted){
        els.stage.innerHTML = state.lastBonusOutcome === 'early'
          ? centerHtml('😬', 'Queimou a largada!', 'tocou antes da cor acender — 0 pontos')
          : centerHtml('✅', 'Enviado!', 'Aguardando o resultado…');
        els.status.textContent = '';
      } else {
        if (gridBuiltForRound !== 'bonus') buildRecallGrid(true);
        els.status.textContent = '⚡ REFLEXO: quando a cor acender NA TELA, toque nela aqui!';
        els.status.className = 'status warn';
      }
    } else if (state.phase === PHASE.REVEAL){
      if (state.bonusReveal){
        if (state.lastBonusOutcome === 'hit'){
          els.stage.innerHTML = centerHtml('⚡', '+' + state.lastBonusPts + (state.lastBonusPts===1?' ponto!':' pontos!'), 'reflexo certeiro');
        } else if (state.lastBonusOutcome === 'early'){
          els.stage.innerHTML = centerHtml('😬', 'Queimou a largada!', 'calma na próxima…');
        } else if (state.lastBonusOutcome === 'wrong'){
          els.stage.innerHTML = centerHtml('🎨', 'Cor errada!', 'era rápido E na cor certa');
        } else {
          els.stage.innerHTML = centerHtml('😴', 'Não deu tempo…', 'o jogo continua');
        }
      // No elimination: a miss costs the round, never the seat. Both faces of
      // this card say "next round is coming".
      } else if (state.lastCleared === true){
        els.stage.innerHTML = centerHtml('✅', 'Isso mesmo!', roundLabel() + ' completa');
      } else if (state.lastCleared === false){
        els.stage.innerHTML = centerHtml('😅', 'Errou essa!',
          state.lastPrefix + '/' + state.round + ' certos — a próxima já vem');
      } else {
        els.stage.innerHTML = centerHtml('⏳', 'Apurando…');
      }
      els.status.textContent = scoreLabel();
    }
  }

  function frame(){
    if (state.phase === PHASE.COUNTDOWN) showCountdown(true);
    if (state.phase === PHASE.RECALL && !submitted && state.memorizeEndsAt && state.recallEndsAt){
      const total = state.recallEndsAt - state.memorizeEndsAt;
      const remain = Math.max(0, state.recallEndsAt - estServerNow());
      const bar = document.getElementById('recallbar');
      if (bar) bar.style.width = (Math.max(0, Math.min(1, remain/total))*100).toFixed(1) + '%';
    }
    requestAnimationFrame(frame);
  }

  function loop(){
    pollState();
    setTimeout(loop, 300);
  }

  (async () => { await join(); render(); loop(); requestAnimationFrame(frame); })();
})();
</script>
</body>
</html>
