<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tap Race — Tela</title>
<style>
  :root{
    --bg:#07060f; --ink:#f6f4ff; --muted:#a39fce;
    --p1:#ff3d81; --p2:#7b2bff; --p3:#00e6c3; --gold:#ffd23f;
    --row:#15132a;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{
    background:
      radial-gradient(120% 80% at 20% -10%, rgba(123,43,255,.30), transparent 55%),
      radial-gradient(120% 80% at 100% 110%, rgba(255,61,129,.28), transparent 55%),
      var(--bg);
    color:var(--ink); overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  #confetti{position:fixed; inset:0; pointer-events:none; z-index:60;}

  .stage{position:absolute; inset:0; display:none; flex-direction:column; padding:3vh 4vw;}
  .stage.show{display:flex;}

  /* header */
  .top{display:flex; align-items:center; justify-content:space-between; gap:2vw;}
  .brand{font-size:clamp(28px,4vw,56px); font-weight:900; letter-spacing:.02em;
    background:linear-gradient(90deg,var(--p1),var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .pill{display:flex; gap:1.4vw;}
  .chip{background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); border-radius:18px; padding:10px 18px; text-align:center;}
  .chip .k{font-size:clamp(10px,1vw,14px); text-transform:uppercase; letter-spacing:.14em; color:var(--muted);}
  .chip .v{font-size:clamp(22px,2.6vw,40px); font-weight:900; font-variant-numeric:tabular-nums; line-height:1;}
  .chip.timer .v{color:var(--gold);} .chip.timer.low .v{color:var(--p1); animation:blink .6s steps(2) infinite;}
  @keyframes blink{50%{opacity:.35}}

  /* ===== LOBBY ===== */
  #lobby{align-items:center; justify-content:center; text-align:center; gap:3vh;}
  #lobby .big{font-size:clamp(40px,7vw,110px); font-weight:900; line-height:1.02;}
  #lobby .sub{font-size:clamp(18px,2.4vw,34px); color:var(--muted); font-weight:700;}
  .join{display:flex; align-items:center; gap:4vw; margin-top:1vh; flex-wrap:wrap; justify-content:center;}
  .qr{background:#fff; padding:18px; border-radius:24px; box-shadow:0 20px 60px rgba(0,0,0,.5); width:min(34vh,320px); height:min(34vh,320px);}
  .qr svg{width:100%; height:100%; display:block;}
  .urlbox{font-size:clamp(28px,5vw,72px); font-weight:900; letter-spacing:.01em;
    background:linear-gradient(90deg,var(--p3),var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .ready{font-size:clamp(22px,3vw,44px); font-weight:800;}
  .ready b{color:var(--p3); font-variant-numeric:tabular-nums;}
  .dotpulse{display:inline-block; width:14px; height:14px; border-radius:50%; background:var(--p3); margin-left:10px; animation:dp 1s infinite;}
  @keyframes dp{0%,100%{opacity:.3; transform:scale(.8)}50%{opacity:1; transform:scale(1.2)}}

  /* ===== COUNTDOWN ===== */
  #countdown{align-items:center; justify-content:center;}
  #cdnum{font-size:min(60vh,46vw); font-weight:900; line-height:.9;
    background:linear-gradient(90deg,var(--p1),var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  #cdnum.go{background:linear-gradient(90deg,var(--p3),var(--gold));}
  .cdpop{animation:cdpop .8s cubic-bezier(.2,1.3,.4,1);}
  @keyframes cdpop{0%{transform:scale(.2);opacity:0}45%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}

  /* ===== RUNNING (leaderboard) ===== */
  #run{gap:2vh;}
  .board{position:relative; flex:1; min-height:0;}
  .row{position:absolute; left:0; right:0; display:grid; grid-template-columns:1.4em 1.1em 1fr auto; align-items:center;
    gap:1.2vw; height:8.6%; padding:0 2vw; border-radius:18px; background:var(--row);
    border:1px solid rgba(255,255,255,.06); will-change:transform; overflow:hidden;}
  .row .barfill{position:absolute; inset:0; border-radius:18px; z-index:0;
    background:linear-gradient(90deg, rgba(123,43,255,.55), rgba(255,61,129,.35)); width:0%; transition:width .12s linear;}
  .row > *{position:relative; z-index:1;}
  .row .rk{font-weight:900; font-size:clamp(18px,2.4vw,38px); color:var(--muted); text-align:center; font-variant-numeric:tabular-nums;}
  .row .em{font-size:clamp(20px,2.6vw,40px);}
  .row .nm{font-weight:800; font-size:clamp(18px,2.4vw,38px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .seq{color:var(--muted); font-weight:700; font-size:.62em;}
  .row .ct{font-weight:900; font-size:clamp(20px,2.8vw,44px); color:var(--gold); font-variant-numeric:tabular-nums;}
  .row.r1{background:linear-gradient(90deg,#3a2e0a,#241f3a); border-color:rgba(255,210,63,.5);}
  .row.r1 .rk{color:var(--gold);}
  .row.r2 .rk{color:#dfe6ff;} .row.r3 .rk{color:#ffb27a;}
  .row.enter{animation:rowin .35s ease;}
  @keyframes rowin{from{opacity:0; transform:translateY(20px) scale(.96)}to{opacity:1}}

  /* ===== ENDED ===== */
  #ended{align-items:center; justify-content:center; gap:2vh; text-align:center;}
  .champlabel{font-size:clamp(22px,3vw,44px); font-weight:900; letter-spacing:.2em; color:var(--gold); text-transform:uppercase;}
  .champ{display:flex; align-items:center; gap:2vw; animation:cdpop .8s cubic-bezier(.2,1.3,.4,1);}
  .champ .em{font-size:min(26vh,22vw);}
  .champ .info{text-align:left;}
  .champ .nm{font-size:clamp(40px,7vw,120px); font-weight:900; line-height:1;}
  .champ .ct{font-size:clamp(26px,3.4vw,56px); font-weight:800; color:var(--p3);}
  .podium{display:flex; gap:1.5vw; margin-top:1vh; flex-wrap:wrap; justify-content:center;}
  .pod{background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); border-radius:16px; padding:10px 18px; font-weight:800; font-size:clamp(14px,1.6vw,24px);}
  .pod b{color:var(--gold);}
  .again{color:var(--muted); font-size:clamp(16px,1.8vw,26px); margin-top:1vh;}

  .hidden{display:none !important;}
</style>
</head>
<body>
  <canvas id="confetti"></canvas>

  <!-- LOBBY -->
  <div class="stage show" id="lobby">
    <div class="big">🔥 TAP RACE</div>
    <div class="sub">Pegue o celular. Aponte a câmera. Toque sem parar.</div>
    <div class="join">
      <div class="qr" id="qr"></div>
      <div>
        <div class="sub" style="margin-bottom:8px">Entre em</div>
        <div class="urlbox" id="url">…</div>
      </div>
    </div>
    <div class="ready"><b id="lobbyCount">0</b> jogadores prontos<span class="dotpulse"></span></div>
  </div>

  <!-- COUNTDOWN -->
  <div class="stage" id="countdown">
    <div id="cdnum" class="cdpop">3</div>
  </div>

  <!-- RUNNING -->
  <div class="stage" id="run">
    <div class="top">
      <div class="brand">🔥 TAP RACE</div>
      <div class="pill">
        <div class="chip"><div class="k">Jogadores</div><div class="v" id="rTotal">0</div></div>
        <div class="chip"><div class="k">Toques</div><div class="v" id="rTaps">0</div></div>
        <div class="chip timer" id="rTimerChip"><div class="k">Tempo</div><div class="v" id="rTimer">0</div></div>
      </div>
    </div>
    <div class="board" id="board"></div>
  </div>

  <!-- ENDED -->
  <div class="stage" id="ended">
    <div class="champlabel">🏆 Campeão 🏆</div>
    <div class="champ" id="champ"></div>
    <div class="podium" id="podium"></div>
    <div class="again">Aguardando o host… (host pode iniciar uma nova rodada)</div>
  </div>

<script>
(() => {
  'use strict';
  const $ = (id)=>document.getElementById(id);
  const PHASE={LOBBY:'lobby',COUNTDOWN:'countdown',RUNNING:'running',ENDED:'ended'};
  const stages={lobby:$('lobby'),countdown:$('countdown'),run:$('run'),ended:$('ended')};
  function showStage(name){ for(const k in stages) stages[k].classList.toggle('show', k===name); }

  let clockOffset=0;
  const estServerNow=()=>Date.now()+clockOffset;
  let cur=PHASE.LOBBY, lastCd=null, endedShownRound=-1;

  // ---- lobby setup ----
  const origin=location.origin;
  $('url').textContent = origin.replace(/^https?:\/\//,'');
  fetch('/qr.svg?data='+encodeURIComponent(origin)).then(r=>r.text()).then(svg=>{$('qr').innerHTML=svg;}).catch(()=>{});

  // ---- SSE ----
  function connect(){
    const es=new EventSource('/events');
    es.onmessage=(e)=>{ try{ onState(JSON.parse(e.data)); }catch(_){} };
    es.onerror=()=>{ es.close(); setTimeout(connect, 1500); };
  }

  function onState(s){
    if(typeof s.serverNow==='number') clockOffset=s.serverNow-Date.now();
    state=s;
    const changed = s.phase!==cur;
    cur=s.phase; // set BEFORE enterPhase so confetti's phase guard sees 'ended'
    if(changed){ enterPhase(s.phase, s); }
    if(s.phase===PHASE.LOBBY){ $('lobbyCount').textContent=s.total; }
    if(s.phase===PHASE.RUNNING || s.phase===PHASE.COUNTDOWN){
      $('rTotal').textContent=s.total; $('rTaps').textContent=fmt(s.totalTaps);
      updateBoard(s.top||[]);
    }
  }

  let state={phase:PHASE.LOBBY,top:[],total:0,totalTaps:0};

  function enterPhase(phase, s){
    if(phase===PHASE.LOBBY){ stopConfetti(); showStage('lobby'); clearBoard(); }
    else if(phase===PHASE.COUNTDOWN){ stopConfetti(); showStage('countdown'); lastCd=null; clearBoard(); }
    else if(phase===PHASE.RUNNING){ stopConfetti(); showStage('run'); }
    else if(phase===PHASE.ENDED){ showEnded(s); }
  }

  // ---- countdown ----
  function fmt(n){ return (n||0).toLocaleString('pt-BR'); }
  function tickCountdown(){
    if(cur===PHASE.COUNTDOWN && state.startsAt){
      const ms=state.startsAt-estServerNow();
      const num=Math.ceil(ms/1000);
      const txt= num>0? String(num):'VAI!';
      if(txt!==lastCd){
        lastCd=txt; const el=$('cdnum');
        el.textContent=txt; el.classList.toggle('go', num<=0);
        el.classList.remove('cdpop'); void el.offsetWidth; el.classList.add('cdpop');
      }
    }
    if(cur===PHASE.RUNNING && state.endsAt){
      const remain=Math.max(0,state.endsAt-estServerNow());
      const secs=Math.ceil(remain/1000);
      $('rTimer').textContent=secs;
      $('rTimerChip').classList.toggle('low', secs<=5);
    }
    requestAnimationFrame(tickCountdown);
  }

  // ---- leaderboard (FLIP + count tween + bars) ----
  const board=$('board');
  const rows=new Map(); // id -> {el, target, display}
  function clearBoard(){ board.innerHTML=''; rows.clear(); }

  function makeRow(p){
    const el=document.createElement('div'); el.className='row enter';
    el.innerHTML='<div class="barfill"></div><div class="rk"></div><div class="em"></div><div class="nm"></div><div class="ct"></div>';
    board.appendChild(el);
    setTimeout(()=>el.classList.remove('enter'),360);
    return {el, target:p.count, display:p.count, bar:el.querySelector('.barfill'),
            rk:el.querySelector('.rk'), em:el.querySelector('.em'), nm:el.querySelector('.nm'), ct:el.querySelector('.ct')};
  }

  function updateBoard(top){
    const max=Math.max(1, top[0]?top[0].count:1);
    // FIRST: record current positions
    const firstRects=new Map();
    for(const [id,r] of rows) firstRects.set(id, r.el.getBoundingClientRect().top);

    const seen=new Set();
    top.forEach((p,i)=>{
      seen.add(p.id);
      let r=rows.get(p.id);
      if(!r){ r=makeRow(p); rows.set(p.id,r); }
      r.target=p.count;
      r.el.style.top=(i*(100/ Math.max(top.length,10)) )+'%';
      r.el.style.transform='';
      // toggle rank classes without clobbering 'row'/'enter' (else the entry animation never paints)
      r.el.classList.remove('r1','r2','r3');
      if(p.rank<=3) r.el.classList.add('r'+p.rank);
      r.rk.textContent=p.rank; r.em.textContent=p.emoji;
      r.nm.innerHTML=escapeHtml(p.name)+' <span class="seq">#'+p.seq+'</span>';
      r.bar.style.width=((p.count/max)*100).toFixed(1)+'%';
    });
    // remove rows no longer in top
    for(const [id,r] of rows){ if(!seen.has(id)){ r.el.remove(); rows.delete(id); } }

    // LAST + INVERT + PLAY
    requestAnimationFrame(()=>{
      for(const [id,r] of rows){
        const last=r.el.getBoundingClientRect().top;
        const first=firstRects.get(id);
        if(first!=null){
          const dy=first-last;
          if(Math.abs(dy)>1){
            r.el.style.transition='none'; r.el.style.transform=`translateY(${dy}px)`;
            requestAnimationFrame(()=>{ r.el.style.transition='transform .45s cubic-bezier(.2,.8,.2,1)'; r.el.style.transform=''; });
          }
        }
      }
    });
  }

  // count tween loop
  function tweenCounts(){
    for(const [,r] of rows){
      if(r.display!==r.target){
        const d=r.target-r.display;
        r.display += Math.abs(d)<1 ? d : d*0.25;
        if(Math.abs(r.target-r.display)<0.5) r.display=r.target;
        r.ct.textContent=fmt(Math.round(r.display));
      }
    }
    requestAnimationFrame(tweenCounts);
  }

  // ---- ended ----
  function showEnded(s){
    showStage('ended');
    const w=s.winner; const top=s.top||[];
    const champ=$('champ');
    if(w){
      champ.innerHTML=`<div class="em">${w.emoji}</div><div class="info"><div class="nm">${escapeHtml(w.name)} <span class="seq">#${w.seq}</span></div><div class="ct">${fmt(w.count)} toques</div></div>`;
    } else {
      champ.innerHTML=`<div class="info"><div class="nm">Ninguém tocou 😴</div></div>`;
    }
    const pod=$('podium'); pod.innerHTML='';
    top.slice(0,5).forEach(p=>{
      const d=document.createElement('div'); d.className='pod';
      d.innerHTML=`<b>#${p.rank}</b> ${p.emoji} ${escapeHtml(p.name)} <span class="seq">#${p.seq}</span> — ${fmt(p.count)}`;
      pod.appendChild(d);
    });
    if(s.roundId!==endedShownRound){ endedShownRound=s.roundId; launchConfetti(); }
  }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // ---- confetti (self-contained, no CDN) ----
  const cvs=$('confetti'), ctx=cvs.getContext('2d');
  let parts=[], confettiOn=false, confettiActive=false;
  function resize(){ cvs.width=innerWidth; cvs.height=innerHeight; }
  resize(); addEventListener('resize',resize);
  const COLORS=['#ff3d81','#7b2bff','#00e6c3','#ffd23f','#ffffff','#ff7ab0'];
  function launchConfetti(){
    parts=[];
    const N=280;
    for(let i=0;i<N;i++){
      parts.push({
        x:Math.random()*cvs.width, y:Math.random()*cvs.height*0.4-60,
        vx:(Math.random()-0.5)*10, vy:-5+Math.random()*6,   // some shoot up then fall: instant burst
        s:7+Math.random()*11, rot:Math.random()*6.28, vr:(Math.random()-0.5)*0.35,
        c:COLORS[i%COLORS.length],
      });
    }
    confettiActive=true;
    if(!confettiOn){ confettiOn=true; requestAnimationFrame(raf); }
  }
  function stopConfetti(){ confettiActive=false; }
  function raf(){
    ctx.clearRect(0,0,cvs.width,cvs.height);
    let alive=0;
    for(const p of parts){
      p.vy+=0.13; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      if(p.y<cvs.height+40){
        alive++;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c;
        ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); ctx.restore();
      }
    }
    if(alive>0 && confettiActive){ requestAnimationFrame(raf); }
    else { ctx.clearRect(0,0,cvs.width,cvs.height); confettiOn=false; }
  }

  // boot
  connect();
  requestAnimationFrame(tickCountdown);
  requestAnimationFrame(tweenCounts);
})();
</script>
</body>
</html>
