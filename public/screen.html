<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#000000" />
<title>Tap Race — Screen</title>
<!-- Roboto is self-hosted in theme.css; no external font request. -->
<link rel="stylesheet" href="/theme.css" />
<style>
  html,body{height:100%;}
  body{overflow:hidden; background:radial-gradient(circle at 50% -8%, rgba(66,133,244,.16), transparent 55%), var(--bg);}
  #confetti{position:fixed; inset:0; pointer-events:none; z-index:60;}

  .stage{position:absolute; inset:0; display:none; flex-direction:column; padding:4vh 5vw;}
  .stage.show{display:flex;}

  /* header */
  .top{display:flex; align-items:center; justify-content:space-between; gap:2vw;}
  .brand{display:flex; align-items:center; gap:.6vw; font-family:var(--font-display); font-size:clamp(26px,3.2vw,46px); font-weight:700; color:var(--ink); letter-spacing:-.01em;}
  .brand .gwm{font-size:.6em; margin-left:.5vw;}
  .pill{display:flex; gap:1.2vw;}
  .chip{background:var(--surface-glass); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid var(--line); border-radius:var(--r-md); box-shadow:var(--e1); padding:10px 22px; text-align:center;}
  .chip .k{font-size:clamp(10px,1vw,15px); text-transform:uppercase; letter-spacing:.08em; color:var(--ink-2); font-weight:500;}
  .chip .v{font-family:var(--font-mono); font-size:clamp(22px,2.6vw,42px); font-weight:500; font-variant-numeric:tabular-nums; line-height:1.1; color:var(--ink);}
  .chip.timer .v{color:var(--g-blue-700);} .chip.timer.low .v{color:var(--g-red); animation:blink .6s steps(2) infinite;}
  @keyframes blink{50%{opacity:.35}}

  /* ===== LOBBY ===== */
  #lobby{align-items:center; justify-content:center; text-align:center; gap:2.4vh;}
  #lobby .big{display:flex; align-items:center; gap:1.4vw; font-family:var(--font-display); font-size:clamp(40px,6.5vw,104px); font-weight:700; letter-spacing:-.02em;}
  #lobby .brandwm{font-size:clamp(20px,2.6vw,44px);}
  #lobby .sub{font-size:clamp(18px,2.2vw,32px); color:var(--ink-2); font-weight:500;}
  .join{display:flex; align-items:center; gap:4vw; margin-top:1vh; flex-wrap:wrap; justify-content:center;}
  .qr{background:#fff; padding:18px; border-radius:var(--r-lg); width:min(34vh,320px); height:min(34vh,320px); box-shadow:0 0 50px rgba(66,133,244,.25); border:1px solid rgba(66,133,244,.3);}
  .qr svg{width:100%; height:100%; display:block;}
  .ready{font-size:clamp(22px,2.8vw,42px); font-weight:500; color:var(--ink);}
  .ready b{font-family:var(--font-mono); color:var(--g-green-700); font-weight:500; font-variant-numeric:tabular-nums;}
  .dotpulse{display:inline-block; width:14px; height:14px; border-radius:50%; background:var(--g-green); margin-left:10px; animation:dp 1s infinite; box-shadow:0 0 12px rgba(52,168,83,.6);}
  @keyframes dp{0%,100%{opacity:.3; transform:scale(.8)}50%{opacity:1; transform:scale(1.2)}}

  /* ===== COUNTDOWN ===== */
  #countdown{align-items:center; justify-content:center;}
  #cdnum{font-family:var(--font-mono); font-size:min(58vh,44vw); font-weight:500; line-height:.9; color:var(--g-blue);}
  #cdnum.n3{color:var(--g-blue); text-shadow:0 0 70px rgba(66,133,244,.5);}
  #cdnum.n2{color:var(--g-red); text-shadow:0 0 70px rgba(234,67,53,.45);}
  #cdnum.n1{color:var(--g-yellow); text-shadow:0 0 70px rgba(251,188,4,.45);}
  #cdnum.go{color:var(--g-green); text-shadow:0 0 90px rgba(52,168,83,.55);}
  .cdpop{animation:cdpop .8s cubic-bezier(.2,1.3,.4,1);}
  @keyframes cdpop{0%{transform:scale(.2);opacity:0}45%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}

  /* ===== RUNNING (leaderboard) ===== */
  #run{gap:2.4vh;}
  .board{position:relative; flex:1; min-height:0;}
  .row{position:absolute; left:0; right:0; display:grid; grid-template-columns:2.4em 1.3em 1fr auto; align-items:center;
    gap:1.4vw; height:8.6%; padding:0 1.8vw 0 .7vw; border-radius:var(--r-md); background:var(--surface);
    border:1px solid var(--line); box-shadow:var(--e1); will-change:transform; overflow:hidden;}
  .row .barfill{position:absolute; inset:0; border-radius:var(--r-md); z-index:0; background:rgba(66,133,244,.16); width:0%; transition:width .12s linear;}
  .row > *{position:relative; z-index:1;}
  .row .rk{justify-self:center; min-width:1.7em; height:1.7em; display:flex; align-items:center; justify-content:center; border-radius:50%;
    font-family:var(--font-mono); font-weight:500; font-size:clamp(15px,1.6vw,26px); color:#fff; background:var(--ink-3); font-variant-numeric:tabular-nums;}
  .row .em{font-size:clamp(20px,2.6vw,40px);}
  .row .nm{font-family:var(--font-display); font-weight:500; font-size:clamp(18px,2.3vw,36px); color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .seq{font-family:var(--font-mono); color:var(--ink-3); font-weight:400; font-size:.58em;}
  .row .ct{font-family:var(--font-mono); font-weight:500; font-size:clamp(20px,2.7vw,42px); color:var(--ink); font-variant-numeric:tabular-nums;}
  .row.r1{border-color:rgba(66,133,244,.5); box-shadow:var(--e2), 0 0 24px rgba(66,133,244,.18);}
  .row.r1 .rk{background:var(--g-yellow); color:#241a00;}  .row.r1 .barfill{background:rgba(251,188,4,.20);}
  .row.r2 .rk{background:var(--g-blue);}                    .row.r2 .barfill{background:rgba(66,133,244,.20);}
  .row.r3 .rk{background:var(--g-green);}                   .row.r3 .barfill{background:rgba(52,168,83,.18);}
  .row.enter{animation:rowin .35s ease;}
  @keyframes rowin{from{opacity:0; transform:translateY(20px) scale(.96)}to{opacity:1}}

  /* ===== ENDED ===== */
  #ended{align-items:center; justify-content:center; gap:2vh; text-align:center;}
  .champlabel{font-size:clamp(22px,2.8vw,42px); font-weight:700; letter-spacing:.12em; color:var(--g-blue-700); text-transform:uppercase;}
  .champ{display:flex; align-items:center; gap:2vw; max-width:92vw; background:var(--surface-glass); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    border:1px solid rgba(66,133,244,.3); box-shadow:var(--e3), var(--glow-strong); border-radius:var(--r-xl); padding:3vh 4vw; animation:cdpop .8s cubic-bezier(.2,1.3,.4,1);}
  .champ .em{font-size:min(24vh,20vw); flex:none;}
  /* min-width:0 or the name refuses to wrap and pushes the card past the screen
     edge — title + animal + adjective runs to 39 characters at worst. */
  .champ .info{text-align:left; min-width:0;}
  .champ .nm{font-family:var(--font-display); font-size:clamp(32px,4.6vw,84px); font-weight:700; line-height:1.06; color:var(--ink);
    text-wrap:balance; overflow-wrap:break-word;}
  .champ .nm .seq{font-family:var(--font-mono); color:var(--ink-2);}
  .champ .ct{font-family:var(--font-mono); font-size:clamp(26px,3.2vw,52px); font-weight:500; color:var(--g-green-700);}
  .podium{display:flex; gap:1.5vw; margin-top:1vh; flex-wrap:wrap; justify-content:center;}
  .pod{background:var(--surface); border:1px solid var(--line); box-shadow:var(--e1); border-radius:var(--r-md); padding:12px 20px; font-weight:500; font-size:clamp(14px,1.5vw,24px); color:var(--ink);}
  .pod b{font-family:var(--font-mono); color:var(--g-blue-700);}
  .again{color:var(--ink-2); font-size:clamp(16px,1.7vw,26px); margin-top:1vh;}
  /* settling beat: the round is over but late batches are still landing */
  .champ.settling .em{animation:settlepulse 1s ease-in-out infinite;}
  .champ.settling .nm{font-size:clamp(28px,3.6vw,60px); font-weight:500; color:var(--ink-2);}
  @keyframes settlepulse{0%,100%{transform:scale(1); opacity:.65} 50%{transform:scale(1.08); opacity:1}}

  .hidden{display:none !important;}
</style>
</head>
<body class="noise-bg">
  <canvas id="confetti"></canvas>

  <!-- LOBBY -->
  <div class="stage show" id="lobby">
    <div class="big"><span class="cloud">☁️</span> <span class="shimmer">Tap Race</span></div>
    <div class="brandwm"><span class="gwm"><span class="b">G</span><span class="r">o</span><span class="y">o</span><span class="b">g</span><span class="g">l</span><span class="r">e</span> <span class="cloud">Cloud</span></span></div>
    <div class="sub">Grab your phone. Point the camera. Tap non-stop.</div>
    <div class="join">
      <div class="qr" id="qr"></div>
    </div>
    <!-- One counted phrase, not "<b>N</b> + literal": word order and the plural
         form both move with the language ("2 Spieler bereit", "0 joueur prêt"). -->
    <div class="ready"><span id="lobbyReady"></span><span class="dotpulse"></span></div>
  </div>

  <!-- COUNTDOWN -->
  <div class="stage" id="countdown">
    <div id="cdnum" class="cdpop n3">3</div>
  </div>

  <!-- RUNNING -->
  <div class="stage" id="run">
    <div class="top">
      <div class="brand"><span class="cloud">☁️</span> <span class="shimmer">Tap Race</span>
        <span class="gwm"><span class="b">G</span><span class="r">o</span><span class="y">o</span><span class="b">g</span><span class="g">l</span><span class="r">e</span> <span class="cloud">Cloud</span></span>
      </div>
      <div class="pill">
        <div class="chip"><div class="k">Players</div><div class="v" id="rTotal">0</div></div>
        <div class="chip"><div class="k">Taps</div><div class="v" id="rTaps">0</div></div>
        <div class="chip timer" id="rTimerChip"><div class="k">Time</div><div class="v" id="rTimer">0</div></div>
      </div>
    </div>
    <div class="board" id="board"></div>
  </div>

  <!-- ENDED -->
  <div class="stage" id="ended">
    <div class="champlabel" id="champlabel">🏆 Champion 🏆</div>
    <div class="champ" id="champ"></div>
    <div class="podium" id="podium"></div>
    <div class="again">Waiting for the host… (a new round can start any time)</div>
  </div>

<script>
(() => {
  'use strict';
  const $ = (id)=>document.getElementById(id);
  const PHASE={LOBBY:'lobby',COUNTDOWN:'countdown',RUNNING:'running',ENDED:'ended'};
  const stages={lobby:$('lobby'),countdown:$('countdown'),run:$('run'),ended:$('ended')};
  function showStage(name){ for(const k in stages) stages[k].classList.toggle('show', k===name); }

  let clockOffset=0, bestRtt=Infinity;
  const estServerNow=()=>Date.now()+clockOffset;
  let cur=PHASE.LOBBY, lastCd=null, endedShownRound=-1, settleShownRound=-1;

  // SSE is one-way, so it can't measure latency: a `serverNow - Date.now()`
  // offset taken from an event is wrong by the whole delivery delay, which is
  // what made the 3·2·1 drift on distant screens. Poll /state occasionally
  // instead and keep the least-delayed round trip (NTP style). This is a single
  // client, not 5.000 phones, so the extra request is free.
  async function sampleClock(){
    const t0=Date.now();
    try{
      const r=await fetch('/state');
      const s=await r.json();
      const t1=Date.now(), rtt=t1-t0;
      if(typeof s.serverNow!=='number' || rtt<0 || rtt>5000) return;
      if(Math.abs((s.serverNow-t1)-clockOffset)>5000) bestRtt=Infinity; // local clock jumped
      if(rtt>bestRtt) return;
      bestRtt=rtt; clockOffset=s.serverNow+rtt/2-t1;
    }catch(_){}
  }

  // ---- lobby setup ----
  // The QR is the only way in — the URL used to be spelled out beside it and
  // is deliberately gone, so nothing on the projector invites typing.
  const origin=location.origin;
  fetch('/qr.svg?data='+encodeURIComponent(origin)).then(r=>r.text()).then(svg=>{$('qr').innerHTML=svg;}).catch(()=>{});

  // ---- SSE ----
  function connect(){
    const es=new EventSource('/events');
    es.onmessage=(e)=>{ try{ onState(JSON.parse(e.data)); }catch(_){} };
    es.onerror=()=>{ es.close(); setTimeout(connect, 1500); };
  }

  function onState(s){
    // Only as a fallback — sampleClock() supersedes this as soon as it lands.
    if(bestRtt===Infinity && typeof s.serverNow==='number') clockOffset=s.serverNow-Date.now();
    state=s;
    const changed = s.phase!==cur;
    cur=s.phase; // set BEFORE enterPhase so confetti's phase guard sees 'ended'
    if(changed){ enterPhase(s.phase, s); }
    if(s.phase===PHASE.LOBBY){ renderReady(s.total); }
    if(s.phase===PHASE.RUNNING || s.phase===PHASE.COUNTDOWN){
      $('rTotal').textContent=fmt(s.total); $('rTaps').textContent=fmt(s.totalTaps);
      updateBoard(s.top||[]);
    }
    // Re-run on every ENDED frame, not just the transition: the reveal is
    // driven by `settled` flipping, which happens after the phase change.
    if(s.phase===PHASE.ENDED){ renderEnded(s); }
  }

  let state={phase:PHASE.LOBBY,top:[],total:0,totalTaps:0};

  function enterPhase(phase, s){
    if(phase===PHASE.LOBBY){ stopConfetti(); showStage('lobby'); clearBoard(); }
    else if(phase===PHASE.COUNTDOWN){ stopConfetti(); showStage('countdown'); lastCd=null; clearBoard(); }
    else if(phase===PHASE.RUNNING){ stopConfetti(); showStage('run'); }
    else if(phase===PHASE.ENDED){ renderEnded(s); }
  }

  // Built once: tweenCounts calls this ~600 times a second across 10 rows.
  const NUM=new Intl.NumberFormat('en');
  function fmt(n){ return NUM.format(Number(n)||0); }

  // The number keeps its own <b> so .ready b can style it green mono.
  function renderReady(total){
    const n=total||0;
    $('lobbyReady').innerHTML='<b>'+escapeHtml(fmt(n))+'</b> '+(n===1?'player ready':'players ready');
  }

  // ---- countdown ----
  function tickCountdown(){
    if(cur===PHASE.COUNTDOWN && state.startsAt){
      const ms=state.startsAt-estServerNow();
      const num=Math.ceil(ms/1000);
      const txt= num>0? String(num):'GO!';
      if(txt!==lastCd){
        lastCd=txt; const el=$('cdnum');
        el.textContent=txt;
        el.className='cdnum ' + (num>0?('n'+Math.min(num,3)):'go'); // Google color per count
        void el.offsetWidth; el.classList.add('cdpop');
      }
    }
    if(cur===PHASE.RUNNING && state.endsAt){
      const remain=Math.max(0,state.endsAt-estServerNow());
      const secs=Math.ceil(remain/1000);
      $('rTimer').textContent=secs;
      $('rTimerChip').classList.toggle('low', secs<=5);
    }
    requestAnimationFrame(tickCountdown);
  }

  // ---- leaderboard (FLIP + count tween + bars) ----
  const board=$('board');
  const rows=new Map(); // id -> {el, target, display}
  function clearBoard(){ board.innerHTML=''; rows.clear(); }

  function makeRow(p){
    const el=document.createElement('div'); el.className='row enter';
    el.innerHTML='<div class="barfill"></div><div class="rk"></div><div class="em"></div><div class="nm"></div><div class="ct"></div>';
    board.appendChild(el);
    setTimeout(()=>el.classList.remove('enter'),360);
    return {el, target:p.count, display:p.count, bar:el.querySelector('.barfill'),
            rk:el.querySelector('.rk'), em:el.querySelector('.em'), nm:el.querySelector('.nm'), ct:el.querySelector('.ct')};
  }

  function updateBoard(top){
    const max=Math.max(1, top[0]?top[0].count:1);
    // FIRST: record current positions
    const firstRects=new Map();
    for(const [id,r] of rows) firstRects.set(id, r.el.getBoundingClientRect().top);

    const seen=new Set();
    top.forEach((p,i)=>{
      seen.add(p.id);
      let r=rows.get(p.id);
      if(!r){ r=makeRow(p); rows.set(p.id,r); }
      r.target=p.count;
      r.el.style.top=(i*(100/ Math.max(top.length,10)) )+'%';
      r.el.style.transform='';
      // toggle rank classes without clobbering 'row'/'enter' (else the entry animation never paints)
      r.el.classList.remove('r1','r2','r3');
      if(p.rank<=3) r.el.classList.add('r'+p.rank);
      r.rk.textContent=p.rank; r.em.textContent=p.emoji;
      r.nm.innerHTML=escapeHtml(p.name)+' <span class="seq">#'+p.seq+'</span>';
      r.bar.style.width=((p.count/max)*100).toFixed(1)+'%';
    });
    // remove rows no longer in top
    for(const [id,r] of rows){ if(!seen.has(id)){ r.el.remove(); rows.delete(id); } }

    // LAST + INVERT + PLAY
    requestAnimationFrame(()=>{
      for(const [id,r] of rows){
        const last=r.el.getBoundingClientRect().top;
        const first=firstRects.get(id);
        if(first!=null){
          const dy=first-last;
          if(Math.abs(dy)>1){
            r.el.style.transition='none'; r.el.style.transform=`translateY(${dy}px)`;
            requestAnimationFrame(()=>{ r.el.style.transition='transform .45s cubic-bezier(.2,.8,.2,1)'; r.el.style.transform=''; });
          }
        }
      }
    });
  }

  // count tween loop
  function tweenCounts(){
    for(const [,r] of rows){
      if(r.display!==r.target){
        const d=r.target-r.display;
        r.display += Math.abs(d)<1 ? d : d*0.25;
        if(Math.abs(r.target-r.display)<0.5) r.display=r.target;
        r.ct.textContent=fmt(Math.round(r.display));
      }
    }
    requestAnimationFrame(tweenCounts);
  }

  // ---- ended ----
  // Two beats. The buzzer ends the round but not the counting: batches tapped
  // before it are still arriving from far-away phones for the length of the
  // grace window. Revealing a champion now risks visibly replacing them a second
  // later, so hold on "apurando" until the server says the result is settled.
  // Idempotent — called on every ENDED frame.
  function renderEnded(s){
    showStage('ended');
    if(!s.settled){
      if(settleShownRound!==s.roundId){
        settleShownRound=s.roundId;
        $('champlabel').textContent='⏳ Counting…';
        const champ=$('champ');
        champ.classList.add('settling');
        champ.innerHTML='<div class="em">⏳</div><div class="info"><div class="nm">'+'Counting the last taps'+'</div></div>';
        $('podium').innerHTML='';
      }
      return;
    }
    if(endedShownRound===s.roundId) return; // already revealed
    endedShownRound=s.roundId;
    $('champlabel').textContent='🏆 Champion 🏆';
    const w=s.winner; const top=s.top||[];
    const champ=$('champ');
    champ.classList.remove('settling');
    if(w){
      champ.innerHTML=`<div class="em">${w.emoji}</div><div class="info"><div class="nm">${escapeHtml(w.name)} <span class="seq">#${w.seq}</span></div><div class="ct">${fmt(w.count)} ${w.count===1?'tap':'taps'}</div></div>`;
    } else {
      champ.innerHTML=`<div class="info"><div class="nm">Nobody tapped 😴</div></div>`;
    }
    const pod=$('podium'); pod.innerHTML='';
    top.slice(0,5).forEach(p=>{
      const d=document.createElement('div'); d.className='pod';
      d.innerHTML=`<b>#${p.rank}</b> ${p.emoji} ${escapeHtml(p.name)} <span class="seq">#${p.seq}</span> — ${fmt(p.count)}`;
      pod.appendChild(d);
    });
    launchConfetti();
  }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // ---- confetti (self-contained, no CDN) ----
  const cvs=$('confetti'), ctx=cvs.getContext('2d');
  let parts=[], confettiOn=false, confettiActive=false;
  function resize(){ cvs.width=innerWidth; cvs.height=innerHeight; }
  resize(); addEventListener('resize',resize);
  const COLORS=['#4285F4','#EA4335','#FBBC04','#34A853']; // Google brand colors
  function launchConfetti(){
    if(matchMedia('(prefers-reduced-motion: reduce)').matches) return; // respect reduced-motion
    parts=[];
    const N=280;
    for(let i=0;i<N;i++){
      parts.push({
        x:Math.random()*cvs.width, y:Math.random()*cvs.height*0.4-60,
        vx:(Math.random()-0.5)*10, vy:-5+Math.random()*6,   // some shoot up then fall: instant burst
        s:7+Math.random()*11, rot:Math.random()*6.28, vr:(Math.random()-0.5)*0.35,
        c:COLORS[i%COLORS.length],
      });
    }
    confettiActive=true;
    if(!confettiOn){ confettiOn=true; requestAnimationFrame(raf); }
  }
  function stopConfetti(){ confettiActive=false; }
  function raf(){
    ctx.clearRect(0,0,cvs.width,cvs.height);
    let alive=0;
    for(const p of parts){
      p.vy+=0.13; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      if(p.y<cvs.height+40){
        alive++;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c;
        ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); ctx.restore();
      }
    }
    if(alive>0 && confettiActive){ requestAnimationFrame(raf); }
    else { ctx.clearRect(0,0,cvs.width,cvs.height); confettiOn=false; }
  }

  // boot
  renderReady(0);
  connect();
  // A short burst first (min-RTT needs a few samples to find a clean one), then
  // a slow heartbeat to ride out drift over a long event.
  for(let i=0;i<4;i++) setTimeout(sampleClock, i*200);
  setInterval(sampleClock, 15000);
  requestAnimationFrame(tickCountdown);
  requestAnimationFrame(tweenCounts);
})();
</script>
</body>
</html>
